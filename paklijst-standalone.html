<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Paklijst Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 50%, #c026d3 100%);
      min-height: 100vh;
      color: white;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
    }

    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
    }

    .glass-dark {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: white;
      color: #7c3aed;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .btn-disabled {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 18px;
      width: auto;
    }

    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .logo {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      margin-bottom: 32px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
    }

    .start-title {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 12px;
      color: white;
    }

    .start-subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .start-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .progress-wrapper { margin-bottom: 24px; padding-top: 8px; }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    .progress-info strong { color: white; }

    .progress-bar {
      height: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: white;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .question-card { padding: 24px; margin-bottom: 100px; }

    .question-title {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: white;
    }

    .question-hint {
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 24px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .options-grid.single-col { grid-template-columns: 1fr; }

    .option-card {
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      min-height: 44px;
    }

    .option-card:active { transform: scale(0.97); }

    .option-card.selected {
      background: white;
      border-color: white;
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.4);
      transform: scale(1.02);
    }

    .option-icon { font-size: 32px; margin-bottom: 8px; }
    .option-label { font-size: 16px; font-weight: 600; color: white; margin-bottom: 4px; }
    .option-card.selected .option-label { color: #7c3aed; }
    .option-desc { font-size: 12px; color: rgba(255, 255, 255, 0.6); }
    .option-card.selected .option-desc { color: #a78bfa; }

    .option-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: #7c3aed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .text-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 18px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .text-input:focus { border-color: white; background: rgba(255, 255, 255, 0.2); }
    .text-input::placeholder { color: rgba(255, 255, 255, 0.5); }

    .date-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      -webkit-appearance: none;
    }

    .date-input:focus { border-color: white; }
    .date-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    .input-group { margin-bottom: 16px; }
    .input-label { display: block; font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.8); margin-bottom: 8px; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .bottom-nav-inner {
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }

    .bottom-nav .btn { flex: 1; }

    /* Destination cards */
    .destination-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .destination-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .destination-icon { font-size: 28px; }
    .destination-name { flex: 1; font-size: 18px; font-weight: 600; }
    .destination-dates { font-size: 13px; color: rgba(255, 255, 255, 0.7); }

    .destination-weather {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      margin-top: 12px;
    }

    .destination-weather-icon { font-size: 24px; }
    .destination-weather-temp { font-size: 20px; font-weight: 700; }
    .destination-weather-desc { flex: 1; font-size: 13px; color: rgba(255, 255, 255, 0.8); }

    .destination-remove {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
    }

    .add-destination-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      cursor: pointer;
    }

    /* Weather summary */
    .weather-summary { margin-bottom: 16px; }

    .weather-card {
      padding: 20px;
      margin-bottom: 12px;
      text-align: center;
    }

    .weather-location { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .weather-period { font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-bottom: 12px; }

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .weather-icon { font-size: 48px; }
    .weather-temp { font-size: 42px; font-weight: 700; }
    .weather-desc { font-size: 14px; color: rgba(255, 255, 255, 0.8); }

    .weather-details {
      display: flex;
      justify-content: space-around;
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .weather-detail { text-align: center; }
    .weather-detail-label { font-size: 11px; color: rgba(255, 255, 255, 0.5); }
    .weather-detail-value { font-size: 14px; font-weight: 600; }

    .trip-duration {
      text-align: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .trip-duration-value { font-size: 32px; font-weight: 700; }
    .trip-duration-label { font-size: 14px; color: rgba(255, 255, 255, 0.7); }

    /* Pre-trip todos */
    .pretodo-card { padding: 20px; margin-bottom: 16px; }

    .pretodo-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pretodo-icon { font-size: 24px; }
    .pretodo-title { font-size: 18px; font-weight: 700; }

    .pretodo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .pretodo-item.done { background: rgba(34, 197, 94, 0.2); }

    .pretodo-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: transparent;
      flex-shrink: 0;
    }

    .pretodo-item.done .pretodo-check { background: #22c55e; border-color: #22c55e; color: white; }

    .pretodo-text { flex: 1; font-size: 14px; }
    .pretodo-item.done .pretodo-text { text-decoration: line-through; opacity: 0.7; }

    .pretodo-urgent {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #ef4444;
      font-weight: 600;
    }

    .pretodo-info {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
    }

    /* Community tips */
    .tips-section { margin-bottom: 16px; }

    .tips-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .tips-title { font-size: 18px; font-weight: 700; }

    .tip-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .tip-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tip-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .tip-author { font-size: 14px; font-weight: 600; }
    .tip-date { font-size: 11px; color: rgba(255, 255, 255, 0.5); }

    .tip-content { font-size: 14px; line-height: 1.5; margin-bottom: 12px; }

    .tip-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .tip-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tip-action {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      background: none;
      border: none;
    }

    .tip-action.liked { color: #f472b6; }

    .add-tip-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      background: white;
      color: #7c3aed;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    /* Companions */
    .companion-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .companion-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .companion-info { flex: 1; }
    .companion-name { font-size: 16px; font-weight: 600; }
    .companion-type { font-size: 13px; color: rgba(255, 255, 255, 0.6); }

    .companion-remove {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
    }

    .add-companion-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; text-align: center; }
    .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .modal-buttons .btn { flex: 1; }

    /* Page elements */
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; padding-top: 16px; }
    .page-subtitle { font-size: 14px; color: rgba(255, 255, 255, 0.7); margin-bottom: 20px; }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      margin-bottom: 20px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }

    .stat-label { font-size: 11px; text-transform: uppercase; color: rgba(255, 255, 255, 0.6); margin-bottom: 4px; }
    .stat-value { font-size: 28px; font-weight: 700; }

    .category-card { margin-bottom: 16px; overflow: hidden; }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .category-icon { font-size: 24px; }
    .category-name { flex: 1; font-size: 16px; font-weight: 600; }

    .category-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .items-container { padding: 8px; }

    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 6px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
    }

    .item-row:active { transform: scale(0.98); }
    .item-row.selected { background: white; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1); }

    .drag-handle { cursor: grab; color: rgba(255, 255, 255, 0.4); font-size: 16px; }
    .item-row.selected .drag-handle { color: #a78bfa; }

    .item-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: transparent;
    }

    .item-row.selected .item-check { background: #7c3aed; border-color: #7c3aed; color: white; }

    .item-name { flex: 1; font-size: 15px; font-weight: 500; color: rgba(255, 255, 255, 0.9); }
    .item-row.selected .item-name { color: #7c3aed; font-weight: 600; }

    .item-weight { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
    .item-row.selected .item-weight { color: #a78bfa; font-weight: 600; }

    .add-item-row { display: flex; gap: 8px; padding: 8px; margin-top: 8px; }

    .add-item-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .add-item-input:focus { border-color: white; }
    .add-item-input::placeholder { color: rgba(255, 255, 255, 0.4); }

    .add-item-btn {
      padding: 12px 16px;
      background: white;
      color: #7c3aed;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* List screen - green theme */
    .list-screen {
      background: linear-gradient(135deg, #14b8a6 0%, #10b981 50%, #22c55e 100%);
      min-height: 100vh;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      gap: 8px;
    }

    .list-back {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
    }

    .list-title { font-size: 20px; font-weight: 700; }

    .list-actions { display: flex; gap: 8px; }

    .action-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:active { transform: scale(0.95); }

    .progress-card { padding: 24px; margin-bottom: 20px; }

    .progress-stats { display: flex; justify-content: space-between; margin-bottom: 16px; }

    .progress-stat-label { font-size: 14px; color: rgba(255, 255, 255, 0.7); margin-bottom: 4px; }
    .progress-stat-value { font-size: 32px; font-weight: 700; }
    .progress-stat-value span { font-size: 20px; color: rgba(255, 255, 255, 0.6); }
    .progress-stat-sub { font-size: 13px; color: rgba(255, 255, 255, 0.6); }

    .list-progress-bar {
      height: 14px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .list-progress-fill {
      height: 100%;
      background: white;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .complete-msg { text-align: center; margin-top: 16px; font-size: 18px; font-weight: 600; }

    .list-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .list-item-row.checked { background: rgba(255, 255, 255, 0.1); }

    .list-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: transparent;
    }

    .list-check:active { transform: scale(0.9); }
    .list-item-row.checked .list-check { background: white; border-color: white; color: #10b981; font-weight: bold; }

    .list-item-info { flex: 1; min-width: 0; }
    .list-item-row.checked .list-item-info { opacity: 0.6; }

    .list-item-name { font-size: 15px; font-weight: 500; }
    .list-item-row.checked .list-item-name { text-decoration: line-through; }
    .list-item-weight { font-size: 13px; color: rgba(255, 255, 255, 0.6); }

    .companion-checks { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

    .companion-check {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);

// Weather data based on destination and date
const getWeatherData = (destination, startDate) => {
  const dest = (destination || '').toLowerCase();
  const month = startDate ? new Date(startDate).getMonth() : new Date().getMonth();
  const isWinter = month >= 10 || month <= 2;
  const isSummer = month >= 5 && month <= 8;

  // Tropical
  if (dest.match(/bali|thailand|vietnam|indonesia|filipijnen|maleisië/)) {
    return { temp: 30, icon: '🌴', desc: 'Tropisch warm', humidity: 80, rain: 60, climate: 'tropical' };
  }
  // Mediterranean
  if (dest.match(/barcelona|spanje|spain|mallorca|ibiza|italie|italy|rome|griekenland|greece|kreta|portugal/)) {
    return isWinter
      ? { temp: 14, icon: '🌤️', desc: 'Mild', humidity: 65, rain: 30, climate: 'mild' }
      : { temp: 28, icon: '☀️', desc: 'Zonnig & warm', humidity: 55, rain: 10, climate: 'hot' };
  }
  // Scandinavia
  if (dest.match(/noorwegen|norway|zweden|sweden|finland|ijsland|iceland|denemarken/)) {
    return isWinter
      ? { temp: -5, icon: '❄️', desc: 'Koud & sneeuw', humidity: 80, rain: 40, climate: 'cold' }
      : { temp: 15, icon: '🌤️', desc: 'Fris', humidity: 70, rain: 35, climate: 'mild' };
  }
  // West Europe cities
  if (dest.match(/paris|parijs|london|londen|amsterdam|brussel|berlin|berlijn/)) {
    return isWinter
      ? { temp: 6, icon: '🌧️', desc: 'Koel & nat', humidity: 85, rain: 60, climate: 'variable' }
      : { temp: 22, icon: '🌤️', desc: 'Aangenaam', humidity: 60, rain: 30, climate: 'mild' };
  }
  // USA
  if (dest.match(/new york|nyc|los angeles|la|miami|california|florida/)) {
    if (dest.match(/miami|florida/)) {
      return { temp: 28, icon: '☀️', desc: 'Warm & vochtig', humidity: 75, rain: 40, climate: 'tropical' };
    }
    return isWinter
      ? { temp: 2, icon: '❄️', desc: 'Koud', humidity: 65, rain: 35, climate: 'cold' }
      : { temp: 28, icon: '☀️', desc: 'Warm', humidity: 70, rain: 40, climate: 'hot' };
  }
  // Default
  return { temp: 20, icon: '🌤️', desc: 'Aangenaam', humidity: 60, rain: 25, climate: 'mild' };
};

// Calculate trip duration from dates
const calcDuration = (destinations) => {
  if (!destinations || destinations.length === 0) return { days: 0, label: 'weekend' };

  let minDate = null, maxDate = null;
  destinations.forEach(d => {
    if (d.startDate) {
      const start = new Date(d.startDate);
      if (!minDate || start < minDate) minDate = start;
    }
    if (d.endDate) {
      const end = new Date(d.endDate);
      if (!maxDate || end > maxDate) maxDate = end;
    }
  });

  if (!minDate || !maxDate) return { days: 0, label: 'weekend' };

  const days = Math.ceil((maxDate - minDate) / (1000 * 60 * 60 * 24)) + 1;
  let label = 'weekend';
  if (days <= 3) label = 'weekend';
  else if (days <= 7) label = 'week';
  else if (days <= 14) label = 'twoweeks';
  else if (days <= 28) label = 'month';
  else label = 'long';

  return { days, label };
};

// Get combined climate from all destinations
const getCombinedClimate = (destinations) => {
  if (!destinations || destinations.length === 0) return 'mild';

  const climates = destinations.map(d => {
    const weather = getWeatherData(d.name, d.startDate);
    return weather.climate;
  });

  // Priority: tropical > hot > cold > variable > mild
  if (climates.includes('tropical')) return 'tropical';
  if (climates.includes('hot')) return 'hot';
  if (climates.includes('cold')) return 'cold';
  if (climates.includes('variable')) return 'variable';
  return 'mild';
};

  todos.push({ id: 'insurance', text: 'Reisverzekering afsluiten', urgent: true });

  destinations.forEach(d => {
    const dest = (d.name || '').toLowerCase();

    // ESTA for USA
    if (dest.match(/usa|amerika|united states|new york|los angeles|miami|california|florida/)) {

    }

    // Visa countries
    if (dest.match(/australia|australië|china|india|russia|rusland|brazil|brazilië/) && !todos.find(t => t.id === 'visa')) {
      todos.push({ id: 'visa', text: `Visum aanvragen voor ${d.name}`, urgent: true, info: 'Kan weken duren!' });
    }

    // Vaccinations
    if (dest.match(/thailand|bali|indonesia|vietnam|india|africa|afrika|brazil|peru|colombia/) && !todos.find(t => t.id === 'vaccinations')) {
      todos.push({ id: 'vaccinations', text: 'Vaccinaties checken bij GGD', urgent: true, info: 'Hepatitis A/B, DTP' });
    }
  });

  if (duration.label === 'month' || duration.label === 'long') {
    todos.push({ id: 'mail', text: 'Post laten vasthouden/doorsturen', urgent: false });
    todos.push({ id: 'plants', text: 'Planten/huisdieren regelen', urgent: false });
  }

  todos.push({ id: 'copies', text: 'Kopieën documenten maken (digitaal)', urgent: false });
  todos.push({ id: 'bank', text: 'Bank informeren over reis', urgent: false });
  todos.push({ id: 'phone', text: 'Buitenlandbundel activeren', urgent: false });

  return todos;
};

const getRecommended = (ans) => {
  const r = {};
  const hasKids = (ans.companions || []).some(c => c.type === 'child' || c.type === 'baby');
  const climate = getCombinedClimate(ans.destinations);

  Object.entries(items).forEach(([k, c]) => {
    if (k === 'kids' && !hasKids) return;

    const f = c.items.filter(i => {
      if (i.always) return true;
      if (i.climate && !i.climate.includes(climate)) return false;
      if (i.activities && !i.activities.some(a => (ans.activities || []).includes(a))) return false;
      if (i.tech && !i.tech.some(t => (ans.tech || []).includes(t))) return false;
      if (i.transport && !i.transport.some(t => (ans.transport || []).includes(t))) return false;
      if (i.destination && !i.destination.some(d => (ans.destination || []).includes(d))) return false;
      return true;
    });
    if (f.length > 0) r[k] = { ...c, items: f };
  });
  return r;
};

        </div>
      </div>`;
  }
  else if (state.screen === "quiz") renderQuiz();

const renderQuiz = () => {
  const vq = getVisibleQuestions();
  const q = vq[state.step];
  const progress = ((state.step + 1) / vq.length) * 100;
  const isMulti = q.type === "multiple";
  const ans = state.answers[q.id];

  let canNext = false;
  if (q.type === 'destinations') canNext = state.answers.destinations && state.answers.destinations.length > 0 && state.answers.destinations[0].name;
  else if (q.type === 'companions') canNext = true;
  else if (isMulti) canNext = ans && ans.length > 0;
  else canNext = !!ans;

  let content = '';

  if (q.type === 'destinations') {
    const destinations = state.answers.destinations || [];
    content = `
      <div class="destinations-list">
        ${destinations.map((d, i) => {
          const weather = d.name ? getWeatherData(d.name, d.startDate) : null;
          return `
            <div class="destination-card">
              <div class="destination-header">
                <span class="destination-icon">📍</span>
                <div style="flex:1">
                  <input type="text" class="text-input" style="margin-bottom:8px" placeholder="Bestemming..."
                    value="${d.name || ''}" oninput="updateDestination(${i},'name',this.value)" onblur="finishDestinationEdit(${i},'name')">
                  <div style="display:flex;gap:8px">
                    <input type="date" class="date-input" style="flex:1" value="${d.startDate || ''}"
                      onchange="updateDestination(${i},'startDate',this.value)" onblur="finishDestinationEdit(${i},'startDate')" placeholder="Van">
                    <input type="date" class="date-input" style="flex:1" value="${d.endDate || ''}"
                      onchange="updateDestination(${i},'endDate',this.value)" onblur="finishDestinationEdit(${i},'endDate')" placeholder="Tot">
                  </div>
                </div>
                ${destinations.length > 1 ? `<button class="destination-remove" onclick="removeDestination(${i})">✕</button>` : ''}
              </div>
              ${weather ? `
                <div class="destination-weather">
                  <span class="destination-weather-icon">${weather.icon}</span>
                  <span class="destination-weather-temp">${weather.temp}°C</span>
                  <span class="destination-weather-desc">${weather.desc}</span>
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
        <div class="add-destination-btn" onclick="addDestination()">
          <span>➕</span> Bestemming toevoegen
        </div>
      </div>`;
  } else if (q.type === 'companions') {
    const companions = state.answers.companions || [];
    content = `
      <div class="companions-list">
        ${companions.map((c, i) => `
          <div class="companion-card">
            <div class="companion-avatar">${c.type === 'baby' ? '👶' : c.type === 'child' ? '🧒' : '👤'}</div>
            <div class="companion-info">
              <div class="companion-name">${c.name}</div>

            </div>
            <button class="companion-remove" onclick="removeCompanion(${i})">✕</button>
          </div>
        `).join('')}
        <div class="add-companion-btn" onclick="showAddCompanion()">
          <span>➕</span> Reisgenoot toevoegen
        </div>
      </div>`;
  } else {
    content = `
      <div class="options-grid">
        ${q.options.map(o => {
          const sel = isMulti ? (ans || []).includes(o.value) : ans === o.value;
          return `
            <div class="option-card ${sel ? 'selected' : ''}" onclick="selectOption('${q.id}','${o.value}',${isMulti})">
              ${sel ? '<div class="option-check">✓</div>' : ''}
              <div class="option-icon">${o.icon}</div>
              <div class="option-label">${o.label}</div>
              <div class="option-desc">${o.desc || ''}</div>
            </div>`;
        }).join('')}
      </div>`;
  }

  document.getElementById("app").innerHTML = `
    <div class="container fade-in">
      <div class="progress-wrapper">
        <div class="progress-info">
          <span>Stap ${state.step + 1} van ${vq.length}</span>

    <div class="bottom-nav glass-dark">
      <div class="bottom-nav-inner">

const renderList = () => {
  let totalW = 0, checkedW = 0, total = 0, checked = 0;
  Object.values(state.list).forEach(c => {

      totalW += i.weight * q;

  const progress = total > 0 ? (checked / total) * 100 : 0;

  let html = `
    <div class="list-screen">
      <div class="container fade-in">
        <div class="list-header">
          <button class="list-back" onclick="backFromList()">← Terug</button>

            </div>

              <div class="progress-stat-label">Gewicht</div>
              <div class="progress-stat-value" style="font-size:24px;">${formatWeight(checkedW)}</div>

            <div class="list-progress-fill" style="width:${progress}%"></div>
          </div>
          ${progress === 100 ? '<div class="complete-msg">🎉 Alles ingepakt!</div>' : ''}

    html += `
      <div class="glass category-card">
        <div class="category-header">
          <span class="category-icon">${cat.icon}</span>

        <div>
          ${cat.items.map((it, idx) => {

            return `
            <div class="list-item-row ${it.checked ? 'checked' : ''}">
              <div class="list-check" onclick="toggleCheck('${ck}',${idx})">${it.checked ? '✓' : ''}</div>
              <div class="list-item-info">
                <div class="list-item-name">${it.name}${(it.quantity || 1) > 1 ? ` (${it.quantity}x)` : ''}</div>
                <div class="list-item-weight">${formatWeight(it.weight * (it.quantity || 1))}</div>
                ${companions.length > 0 ? `
                  <div class="companion-checks">
                    ${companions.map((c, ci) => `
                      <div class="companion-check ${companionChecks[ci] ? 'checked' : ''}"
                           onclick="toggleCompanionCheck('${ck}',${idx},${ci})"
                           title="${c.name}">
                        <span class="companion-initial">${c.name.charAt(0).toUpperCase()}</span>
                        ${companionChecks[ci] ? '<span class="companion-tick">✓</span>' : ''}
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
              <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty('${ck}',${idx},-1)">−</button>
                <span class="qty-value">${it.quantity || 1}</span>
                <button class="qty-btn" onclick="changeQty('${ck}',${idx},1)">+</button>
              </div>

          <div class="add-item-row" style="padding:12px;">

  html += `</div></div></div>`;

// Event handlers
window.startQuiz = () => {
  if (!state.answers.destinations || state.answers.destinations.length === 0) {
    state.answers.destinations = [{ name: '', startDate: '', endDate: '' }];
  }
  state.screen = "quiz";
  state.step = 0;
  render();
};
window.resumeList = () => { state.screen = "list"; render(); };
window.goToCommunity = () => { state.screen = "community"; render(); };
window.goToStart = () => { state.screen = "start"; render(); };

window.addDestination = () => {
  state.answers.destinations.push({ name: '', startDate: '', endDate: '' });
  render();
};

window.removeDestination = (idx) => {
  state.answers.destinations.splice(idx, 1);
  render();
};

window.updateDestination = (idx, field, value) => {
  state.answers.destinations[idx][field] = value;
  // Don't render on every keystroke - this destroys the DOM and loses focus
};

window.finishDestinationEdit = (idx, field) => {
  // Called on blur - save state and re-render to update weather preview
  saveState();
  render();
};

window.selectOption = (qid, val, multi) => {
  if (multi) {
    const cur = state.answers[qid] || [];
    state.answers[qid] = cur.includes(val) ? cur.filter(v => v !== val) : [...cur, val];
  } else {
    state.answers[qid] = val;
  }
  render();
};

window.prevStep = () => { if (state.step > 0) { state.step--; render(); } };

window.nextStep = () => {
  const vq = getVisibleQuestions();
  if (state.step < vq.length - 1) { state.step++; render(); }
  else { state.screen = "weather"; render(); }
};

window.backFromWeather = () => { state.screen = "quiz"; render(); };
window.goToPreTodos = () => { state.screen = "pretodos"; render(); };
window.backFromPreTodos = () => { state.screen = "weather"; render(); };
window.goToSuggestions = () => { state.screen = "suggestions"; render(); };
window.backFromSuggestions = () => { state.screen = "pretodos"; render(); };
window.backFromList = () => { state.screen = "suggestions"; render(); };

window.togglePreTodo = (id) => { state.preTodos[id] = !state.preTodos[id]; saveState(); render(); };

window.showAddCompanion = () => { state.modal = { type: 'addCompanion', companionType: 'adult' }; render(); };
window.setCompanionType = (type) => { state.modal.companionType = type; render(); };
window.closeModal = (e) => { if (!e || e.target === e.currentTarget) { state.modal = null; render(); } };

window.confirmAddCompanion = () => {
  const name = document.getElementById('companion-name').value.trim();
  if (!name) return;
  if (!state.answers.companions) state.answers.companions = [];
  state.answers.companions.push({ name, type: state.modal.companionType });
  state.modal = null;
  render();
};

window.removeCompanion = (idx) => { state.answers.companions.splice(idx, 1); render(); };

window.toggleItem = (ck, iid) => {
  if (!state.selected[ck]) state.selected[ck] = {};
  state.selected[ck][iid] = !state.selected[ck][iid];
  render();
};

window.addCustomItem = (ck) => {
  const input = document.getElementById(`add-${ck}`);
  const name = input.value.trim();
  if (!name) return;
  if (!state.customItems[ck]) state.customItems[ck] = [];
  const id = 'custom_' + Date.now();
  state.customItems[ck].push({ id, name, weight: 100 });
  if (!state.selected[ck]) state.selected[ck] = {};
  state.selected[ck][id] = true;
  input.value = '';
  render();
};

window.handleAddItem = (e, ck) => { if (e.key === 'Enter') addCustomItem(ck); };

window.addListItem = (ck) => {
  const input = document.getElementById(`addlist-${ck}`);
  const name = input.value.trim();
  if (!name) return;
  state.list[ck].items.push({ id: 'custom_' + Date.now(), name, weight: 100, checked: false, quantity: 1 });
  input.value = '';
  saveState();
  render();
};

window.handleAddListItem = (e, ck) => { if (e.key === 'Enter') addListItem(ck); };

window.createList = () => {
  const rec = getRecommended(state.answers);
  const list = {};

  Object.entries(state.selected).forEach(([ck, its]) => {
    const sel = [];
    Object.entries(its).forEach(([iid, s]) => {
      if (s) {
        let it = rec[ck]?.items.find(i => i.id === iid);
        if (!it && state.customItems[ck]) it = state.customItems[ck].find(i => i.id === iid);
        if (it) sel.push({ ...it, checked: false, quantity: 1 });
      }
    });
    if (sel.length > 0) list[ck] = { name: rec[ck]?.name || 'Custom', icon: rec[ck]?.icon || '📦', items: sel };
  });

  if (Object.keys(list).length === 0) return;
  state.list = list;
  state.screen = "list";
  saveState();
  render();
};

window.toggleCheck = (ck, idx) => { state.list[ck].items[idx].checked = !state.list[ck].items[idx].checked; saveState(); render(); };

window.toggleCompanionCheck = (ck, idx, companionIdx) => {
  const key = `${ck}_${idx}`;
  if (!state.companionChecks[key]) state.companionChecks[key] = {};
  state.companionChecks[key][companionIdx] = !state.companionChecks[key][companionIdx];
  saveState();
  render();
};

window.changeQty = (ck, idx, d) => {
  const it = state.list[ck].items[idx];
  it.quantity = Math.max(1, (it.quantity || 1) + d);
  saveState();
  render();
};

window.deleteItem = (ck, idx) => {
  state.list[ck].items.splice(idx, 1);
  if (state.list[ck].items.length === 0) delete state.list[ck];
  saveState();
  render();
};

window.shareList = async () => {
  let text = '🧳 Mijn Paklijst\n\n';
  Object.entries(state.list).forEach(([ck, cat]) => {
    text += `${cat.icon} ${cat.name}\n`;
    cat.items.forEach(it => {
      text += `${it.checked ? '✅' : '⬜'} ${it.name}${(it.quantity || 1) > 1 ? ` (${it.quantity}x)` : ''}\n`;
    });
    text += '\n';
  });

  if (navigator.share) {
    try { await navigator.share({ title: 'Mijn Paklijst', text }); }
    catch (e) { copyToClipboard(text); }
  } else { copyToClipboard(text); }
};

const copyToClipboard = (text) => {
  navigator.clipboard.writeText(text).then(() => showToast('Gekopieerd!')).catch(() => showToast('Fout'));
};

const showToast = (msg) => {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
};

window.restart = () => {
  if (confirm('Opnieuw beginnen?')) {
    state = { screen: "start", answers: { destinations: [] }, step: 0, selected: {}, list: null, preTodos: {}, modal: null, customItems: {}, likedTips: {}, communityTab: 'tips' };
    localStorage.removeItem('paklijst_state_v2');
    render();
  }
};

// Community functions
window.setCommunityTab = (tab) => { state.communityTab = tab; render(); };

window.toggleLike = (id) => {
  state.likedTips[id] = !state.likedTips[id];
  saveState();
  render();
};

window.addTipToList = (id) => {
  const tip = communityTips.find(t => t.id === id);
  if (tip && tip.item) {
    if (!state.customItems.accessories) state.customItems.accessories = [];
    const itemId = 'tip_' + id;
    if (!state.customItems.accessories.find(i => i.id === itemId)) {
      state.customItems.accessories.push({ id: itemId, name: tip.item.name, weight: 50 });
      showToast(`${tip.item.name} toegevoegd!`);
    }
  }
};

window.submitTip = () => {
  const content = document.getElementById('new-tip-content').value.trim();
  if (!content) return;
  showToast('Tip ingediend! (demo)');
  state.communityTab = 'tips';
  render();
};

render();
</script>
</body>
</html>
