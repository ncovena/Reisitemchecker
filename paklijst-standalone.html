<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Paklijst Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Theme System - CSS Variables */
    :root {
      --theme: 'classic';

      /* Classic Theme (Default) */
      --bg-gradient: linear-gradient(135deg, #7c3aed 0%, #9333ea 50%, #c026d3 100%);
      --bg-solid: #7c3aed;
      --primary: #7c3aed;
      --primary-light: #9333ea;
      --accent: #c026d3;

      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.8);
      --text-muted: rgba(255, 255, 255, 0.6);

      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-dark: rgba(0, 0, 0, 0.5);

      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.2);
      --card-selected-bg: #ffffff;
      --card-selected-text: #7c3aed;
      --card-selected-shadow: rgba(124, 58, 237, 0.4);

      --btn-primary-bg: #ffffff;
      --btn-primary-text: #7c3aed;
      --btn-secondary-bg: rgba(255, 255, 255, 0.2);
      --btn-secondary-border: rgba(255, 255, 255, 0.3);

      --progress-bg: rgba(255, 255, 255, 0.2);
      --progress-fill: #ffffff;

      --check-bg: linear-gradient(135deg, #4ade80, #22c55e);
      --check-border: #22c55e;

      --list-gradient: linear-gradient(135deg, #14b8a6 0%, #10b981 50%, #22c55e 100%);

      --card-bg-overlay: linear-gradient(to bottom, rgba(124, 58, 237, 0.1) 0%, rgba(124, 58, 237, 0.7) 100%);
      --card-bg-overlay-hover: linear-gradient(to bottom, rgba(124, 58, 237, 0.05) 0%, rgba(124, 58, 237, 0.6) 100%);
      --card-selected-overlay: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.75));
      --card-bg-hover: rgba(255, 255, 255, 0.25);
    }

    /* Pastel Theme */
    [data-theme="pastel"] {
      --bg-gradient: linear-gradient(135deg, #E6E6FA 0%, #FFB7D5 50%, #B5EAD7 100%);
      --bg-solid: #E6E6FA;
      --primary: #B48EAD;
      --primary-light: #D4A5C9;
      --accent: #98D8C8;

      --text-primary: #4A4A6A;
      --text-secondary: rgba(74, 74, 106, 0.8);
      --text-muted: rgba(74, 74, 106, 0.6);

      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-dark: rgba(74, 74, 106, 0.8);

      --card-bg: rgba(255, 255, 255, 0.5);
      --card-border: rgba(180, 142, 173, 0.3);
      --card-selected-bg: #ffffff;
      --card-selected-text: #B48EAD;
      --card-selected-shadow: rgba(180, 142, 173, 0.4);

      --btn-primary-bg: #ffffff;
      --btn-primary-text: #B48EAD;
      --btn-secondary-bg: rgba(255, 255, 255, 0.5);
      --btn-secondary-border: rgba(180, 142, 173, 0.4);

      --progress-bg: rgba(255, 255, 255, 0.5);
      --progress-fill: #B48EAD;

      --check-bg: linear-gradient(135deg, #98D8C8, #7EC8B8);
      --check-border: #7EC8B8;

      --list-gradient: linear-gradient(135deg, #B5EAD7 0%, #98D8C8 50%, #FFB7D5 100%);

      --card-bg-overlay: linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.6) 100%);
      --card-bg-overlay-hover: linear-gradient(to bottom, rgba(255, 255, 255, 0.0) 0%, rgba(255, 255, 255, 0.5) 100%);
      --card-selected-overlay: linear-gradient(135deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.8));
      --card-bg-hover: rgba(255, 255, 255, 0.7);
    }

    /* Neon/Cyberpunk Theme */
    [data-theme="neon"] {
      --bg-gradient: linear-gradient(135deg, #0A0A0A 0%, #1a0a2e 50%, #0D1B2A 100%);
      --bg-solid: #0A0A0A;
      --primary: #00FFFF;
      --primary-light: #00D4FF;
      --accent: #FF1493;

      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.6);

      --glass-bg: rgba(0, 255, 255, 0.08);
      --glass-border: rgba(0, 255, 255, 0.3);
      --glass-dark: rgba(0, 0, 0, 0.8);

      --card-bg: rgba(0, 255, 255, 0.05);
      --card-border: rgba(0, 255, 255, 0.25);
      --card-selected-bg: rgba(0, 255, 255, 0.15);
      --card-selected-text: #00FFFF;
      --card-selected-shadow: rgba(0, 255, 255, 0.5);

      --btn-primary-bg: #00FFFF;
      --btn-primary-text: #0A0A0A;
      --btn-secondary-bg: rgba(0, 255, 255, 0.1);
      --btn-secondary-border: rgba(0, 255, 255, 0.4);

      --progress-bg: rgba(0, 255, 255, 0.2);
      --progress-fill: #00FFFF;

      --check-bg: linear-gradient(135deg, #00FFFF, #00D4FF);
      --check-border: #00FFFF;

      --list-gradient: linear-gradient(135deg, #0A0A0A 0%, #1a0a2e 50%, #0D1B2A 100%);

      --card-bg-overlay: linear-gradient(to bottom, rgba(10, 10, 10, 0.1) 0%, rgba(10, 10, 10, 0.7) 100%);
      --card-bg-overlay-hover: linear-gradient(to bottom, rgba(10, 10, 10, 0.05) 0%, rgba(10, 10, 10, 0.6) 100%);
      --card-selected-overlay: linear-gradient(135deg, rgba(0, 255, 255, 0.12), rgba(0, 212, 255, 0.12));
      --card-bg-hover: rgba(0, 255, 255, 0.15);
    }

    /* Neon theme special effects */
    [data-theme="neon"] .glass {
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.15), inset 0 0 20px rgba(0, 255, 255, 0.05);
    }

    [data-theme="neon"] .btn-primary {
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), 0 0 40px rgba(0, 255, 255, 0.3);
    }

    [data-theme="neon"] .option-card.selected {
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), 0 0 40px rgba(0, 255, 255, 0.2);
      border-color: var(--primary);
    }

    [data-theme="neon"] .list-check,
    [data-theme="neon"] .pretodo-check {
      border-color: var(--primary);
    }

    [data-theme="neon"] .companion-check.checked {
      background: var(--check-bg);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    /* Ocean Theme - Beach & Teal vibes */
    [data-theme="ocean"] {
      --bg-gradient: linear-gradient(135deg, #0077B6 0%, #00B4D8 50%, #48CAE4 100%);
      --bg-solid: #0077B6;
      --primary: #0077B6;
      --primary-light: #00B4D8;
      --accent: #48CAE4;

      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.65);

      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.3);
      --glass-dark: rgba(0, 50, 80, 0.7);

      --card-bg: rgba(255, 255, 255, 0.15);
      --card-border: rgba(255, 255, 255, 0.25);
      --card-selected-bg: #ffffff;
      --card-selected-text: #0077B6;
      --card-selected-shadow: rgba(0, 119, 182, 0.4);

      --btn-primary-bg: #ffffff;
      --btn-primary-text: #0077B6;
      --btn-secondary-bg: rgba(255, 255, 255, 0.2);
      --btn-secondary-border: rgba(255, 255, 255, 0.35);

      --progress-bg: rgba(255, 255, 255, 0.25);
      --progress-fill: #ffffff;

      --check-bg: linear-gradient(135deg, #48CAE4, #00B4D8);
      --check-border: #00B4D8;

      --list-gradient: linear-gradient(135deg, #0077B6 0%, #00B4D8 50%, #48CAE4 100%);

      --card-bg-overlay: linear-gradient(to bottom, rgba(0, 90, 150, 0.1) 0%, rgba(0, 90, 150, 0.7) 100%);
      --card-bg-overlay-hover: linear-gradient(to bottom, rgba(0, 90, 150, 0.05) 0%, rgba(0, 90, 150, 0.6) 100%);
      --card-selected-overlay: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.75));
      --card-bg-hover: rgba(255, 255, 255, 0.28);
    }

    /* Sunset Theme - Warm golden hour */
    [data-theme="sunset"] {
      --bg-gradient: linear-gradient(135deg, #F77F00 0%, #FC8621 30%, #D62828 70%, #9D0208 100%);
      --bg-solid: #F77F00;
      --primary: #F77F00;
      --primary-light: #FC8621;
      --accent: #D62828;

      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.9);
      --text-muted: rgba(255, 255, 255, 0.7);

      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-dark: rgba(80, 20, 0, 0.7);

      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.22);
      --card-selected-bg: #ffffff;
      --card-selected-text: #D62828;
      --card-selected-shadow: rgba(214, 40, 40, 0.4);

      --btn-primary-bg: #ffffff;
      --btn-primary-text: #D62828;
      --btn-secondary-bg: rgba(255, 255, 255, 0.2);
      --btn-secondary-border: rgba(255, 255, 255, 0.3);

      --progress-bg: rgba(255, 255, 255, 0.2);
      --progress-fill: #ffffff;

      --check-bg: linear-gradient(135deg, #FCBF49, #F77F00);
      --check-border: #F77F00;

      --list-gradient: linear-gradient(135deg, #F77F00 0%, #FC8621 50%, #FCBF49 100%);

      --card-bg-overlay: linear-gradient(to bottom, rgba(150, 50, 0, 0.1) 0%, rgba(150, 50, 0, 0.7) 100%);
      --card-bg-overlay-hover: linear-gradient(to bottom, rgba(150, 50, 0, 0.05) 0%, rgba(150, 50, 0, 0.6) 100%);
      --card-selected-overlay: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.75));
      --card-bg-hover: rgba(255, 255, 255, 0.25);
    }

    /* Forest Theme - Earth & Nature tones */
    [data-theme="forest"] {
      --bg-gradient: linear-gradient(135deg, #2D6A4F 0%, #40916C 50%, #52B788 100%);
      --bg-solid: #2D6A4F;
      --primary: #2D6A4F;
      --primary-light: #40916C;
      --accent: #52B788;

      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.65);

      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-dark: rgba(20, 50, 30, 0.7);

      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.2);
      --card-selected-bg: #ffffff;
      --card-selected-text: #2D6A4F;
      --card-selected-shadow: rgba(45, 106, 79, 0.4);

      --btn-primary-bg: #ffffff;
      --btn-primary-text: #2D6A4F;
      --btn-secondary-bg: rgba(255, 255, 255, 0.2);
      --btn-secondary-border: rgba(255, 255, 255, 0.3);

      --progress-bg: rgba(255, 255, 255, 0.2);
      --progress-fill: #ffffff;

      --check-bg: linear-gradient(135deg, #95D5B2, #52B788);
      --check-border: #52B788;

      --list-gradient: linear-gradient(135deg, #2D6A4F 0%, #40916C 50%, #52B788 100%);

      --card-bg-overlay: linear-gradient(to bottom, rgba(30, 70, 50, 0.1) 0%, rgba(30, 70, 50, 0.7) 100%);
      --card-bg-overlay-hover: linear-gradient(to bottom, rgba(30, 70, 50, 0.05) 0%, rgba(30, 70, 50, 0.6) 100%);
      --card-selected-overlay: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.75));
      --card-bg-hover: rgba(255, 255, 255, 0.25);
    }

    /* Midnight Theme - Clean dark mode */
    [data-theme="midnight"] {
      --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --bg-solid: #1a1a2e;
      --primary: #e94560;
      --primary-light: #ff6b6b;
      --accent: #533483;

      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.8);
      --text-muted: rgba(255, 255, 255, 0.55);

      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-dark: rgba(0, 0, 0, 0.6);

      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-selected-bg: #e94560;
      --card-selected-text: #ffffff;
      --card-selected-shadow: rgba(233, 69, 96, 0.4);

      --btn-primary-bg: #e94560;
      --btn-primary-text: #ffffff;
      --btn-secondary-bg: rgba(255, 255, 255, 0.1);
      --btn-secondary-border: rgba(255, 255, 255, 0.2);

      --progress-bg: rgba(255, 255, 255, 0.15);
      --progress-fill: #e94560;

      --check-bg: linear-gradient(135deg, #e94560, #ff6b6b);
      --check-border: #e94560;

      --list-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);

      --card-bg-overlay: linear-gradient(to bottom, rgba(20, 20, 40, 0.1) 0%, rgba(20, 20, 40, 0.7) 100%);
      --card-bg-overlay-hover: linear-gradient(to bottom, rgba(20, 20, 40, 0.05) 0%, rgba(20, 20, 40, 0.6) 100%);
      --card-selected-overlay: linear-gradient(135deg, rgba(233, 69, 96, 0.5), rgba(255, 107, 107, 0.5));
      --card-bg-hover: rgba(255, 255, 255, 0.12);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-primary);
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
    }

    .glass-dark {
      background: var(--glass-dark);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary {
      background: var(--btn-secondary-bg);
      color: var(--text-primary);
      border: 2px solid var(--btn-secondary-border);
    }

    .btn-disabled {
      background: var(--glass-bg);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .btn-back {
      background: var(--glass-bg);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
      padding: 18px;
      width: auto;
    }

    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .logo {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      margin-bottom: 32px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
    }

    .start-title {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .start-subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .start-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .progress-wrapper { margin-bottom: 24px; padding-top: 8px; }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-info strong { color: var(--text-primary); }

    .progress-bar {
      height: 10px;
      background: var(--progress-bg);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--progress-fill);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .question-card { padding: 24px; margin-bottom: 100px; }

    .question-title {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .question-hint {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .options-grid.single-col { grid-template-columns: 1fr; }

    .option-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      min-height: 44px;
    }

    .option-card:active { transform: scale(0.97); }

    .option-card.selected {
      background: var(--card-selected-bg);
      border-color: var(--card-selected-bg);
      box-shadow: 0 8px 32px var(--card-selected-shadow);
      transform: scale(1.02);
    }

    .option-icon { font-size: 32px; margin-bottom: 8px; }
    .option-label { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .option-card.selected .option-label { color: var(--card-selected-text); }

    /* Option cards with background images */
    .option-card.with-bg {
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .option-card.with-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--card-bg-overlay);
      transition: all 0.2s ease;
    }

    .option-card.with-bg:hover::before {
      background: var(--card-bg-overlay-hover);
    }

    .option-card.with-bg.selected::before {
      background: var(--card-selected-overlay);
    }

    .option-card.with-bg .option-content {
      position: relative;
      z-index: 1;
      padding-top: 40px;
    }

    .option-card.with-bg .option-label {
      font-size: 17px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .option-card.with-bg .option-desc {
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .option-card.with-bg.selected .option-label,
    .option-card.with-bg.selected .option-desc {
      text-shadow: none;
    }
    .option-desc { font-size: 12px; color: var(--text-muted); }
    .option-card.selected .option-desc { color: var(--primary-light); }

    .option-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .text-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid var(--card-border);
      border-radius: 16px;
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 18px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .text-input:focus { border-color: var(--primary); background: var(--glass-bg); }
    .text-input::placeholder { color: var(--text-muted); }

    .date-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid var(--card-border);
      border-radius: 16px;
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      -webkit-appearance: none;
    }

    .date-input:focus { border-color: var(--primary); }
    .date-input::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }

    /* Fix calendar picker for dark themes */
    [data-theme="neon"] .date-input::-webkit-calendar-picker-indicator { filter: invert(1); }
    [data-theme="classic"] .date-input::-webkit-calendar-picker-indicator { filter: invert(1); }

    .input-group { margin-bottom: 16px; }
    .input-label { display: block; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .bottom-nav-inner {
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }

    .bottom-nav .btn { flex: 1; }

    /* Destination cards */
    .destination-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .destination-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .destination-icon { font-size: 28px; }
    .destination-name { flex: 1; font-size: 18px; font-weight: 600; }
    .destination-dates { font-size: 13px; color: var(--text-secondary); }

    .destination-weather {

      color: var(--text-secondary);
      font-size: 15px;

    /* Weather summary */

    .weather-card {
      padding: 20px;
      margin-bottom: 12px;
      text-align: center;

    .weather-location { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .weather-period { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

    .weather-main {

      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;

    .weather-icon { font-size: 48px; }
    .weather-temp { font-size: 42px; font-weight: 700; }
    .weather-desc { font-size: 14px; color: var(--text-secondary); }

    .weather-details {

      justify-content: space-around;
      padding-top: 12px;

    .weather-detail { text-align: center; }
    .weather-detail-label { font-size: 11px; color: var(--text-muted); }
    .weather-detail-value { font-size: 14px; font-weight: 600; }

    .trip-duration {

      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;

    .trip-duration-value { font-size: 32px; font-weight: 700; }

    /* Pre-trip todos */
    .pretodo-card { padding: 20px; margin-bottom: 16px; }

    .pretodo-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pretodo-icon { font-size: 24px; }
    .pretodo-title { font-size: 18px; font-weight: 700; }

    .pretodo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .pretodo-item.done { background: rgba(34, 197, 94, 0.2); }

    .pretodo-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: transparent;
      flex-shrink: 0;
    }

    .pretodo-item.done .pretodo-check { background: #22c55e; border-color: #22c55e; color: white; }

    .pretodo-text { flex: 1; font-size: 14px; }
    .pretodo-item.done .pretodo-text { text-decoration: line-through; opacity: 0.7; }

    .pretodo-urgent {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #ef4444;
      font-weight: 600;
    }

    .pretodo-info {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
    }

    /* Community tips */
    .tips-section { margin-bottom: 16px; }

    .tips-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .tips-title { font-size: 18px; font-weight: 700; }

    .tip-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .tip-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tip-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .tip-author { font-size: 14px; font-weight: 600; }
    .tip-date { font-size: 11px; color: var(--text-muted); }

    .tip-content { font-size: 14px; line-height: 1.5; margin-bottom: 12px; }

    .tip-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .tip-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tip-action {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      background: none;
      border: none;
    }

    .tip-action.liked { color: #f472b6; }

    .add-tip-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    /* Companions */
    .companion-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .companion-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .companion-info { flex: 1; }
    .companion-name { font-size: 16px; font-weight: 600; }
    .companion-type { font-size: 13px; color: var(--text-muted); }

    .companion-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
    }

    .add-companion-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      background: var(--card-bg);
      border: 2px dashed var(--card-border);
      border-radius: 16px;
      color: var(--text-secondary);
      font-size: 15px;
      cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: var(--bg-gradient);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; text-align: center; }
    .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .modal-buttons .btn { flex: 1; }

    /* Page elements */
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; padding-top: 16px; color: var(--text-primary); }
    .page-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      margin-bottom: 20px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }

    .stat-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 28px; font-weight: 700; }

    .category-card { margin-bottom: 16px; overflow: hidden; }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .category-icon { font-size: 24px; }
    .category-name { flex: 1; font-size: 16px; font-weight: 600; }

    .category-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .items-container { padding: 8px; }

    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 6px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
    }

    .item-row:active { transform: scale(0.98); }
    .item-row.selected { background: white; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1); }

    .drag-handle { cursor: grab; color: var(--text-muted); font-size: 16px; }
    .item-row.selected .drag-handle { color: var(--primary-light); }

    .item-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: transparent;
    }

    .item-row.selected .item-check { background: var(--primary); border-color: var(--primary); color: var(--btn-primary-bg); }

    .item-name { flex: 1; font-size: 15px; font-weight: 500; color: var(--text-primary); }
    .item-row.selected .item-name { color: var(--primary); font-weight: 600; }

    .item-weight { font-size: 13px; color: var(--text-muted); }
    .item-row.selected .item-weight { color: var(--primary); font-weight: 600; opacity: 0.7; }

    .add-item-row { display: flex; gap: 8px; padding: 8px; margin-top: 8px; }

    .add-item-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .add-item-input:focus { border-color: var(--primary); }
    .add-item-input::placeholder { color: var(--text-muted); }

    .add-item-btn {
      padding: 12px 16px;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* List screen - green theme */
    .list-screen {
      background: var(--list-gradient);
      min-height: 100vh;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      gap: 8px;
    }

    .list-back {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
    }

    .list-title { font-size: 20px; font-weight: 700; }

    .list-actions { display: flex; gap: 8px; }

    .action-btn {
      background: var(--glass-bg);
      border: none;
      color: var(--text-primary);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:active { transform: scale(0.95); }

    /* List Tabs */
    .list-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .list-tab {
      flex: 1;
      min-width: 100px;
      padding: 12px 16px;
      background: var(--glass-bg);
      border: none;
      border-radius: 12px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
    }

    .list-tab.active {
      background: var(--card-bg-hover);
      color: var(--text-primary);
      font-weight: 600;
    }

    .list-tab:hover { background: var(--card-bg-hover); }

    .tab-badge {
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    /* Pretodo Items */
    .pretodo-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pretodo-item:last-child { border-bottom: none; }
    .pretodo-item:hover { background: rgba(255, 255, 255, 0.05); }

    .pretodo-item.checked { opacity: 0.6; }
    .pretodo-item.checked .pretodo-text { text-decoration: line-through; }

    .pretodo-check {
      width: 24px;
      height: 24px;
      border: 2px solid var(--card-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .pretodo-item.checked .pretodo-check {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border-color: #22c55e;
    }

    .pretodo-content { flex: 1; cursor: pointer; }
    .pretodo-text { font-size: 15px; font-weight: 500; }
    .pretodo-info { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .pretodo-companions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }

    .companion-check.small {
      width: 24px;
      height: 24px;
    }

    .companion-check.small .companion-initial { font-size: 10px; }

    .companion-check.small .companion-tick {
      width: 12px;
      height: 12px;
      font-size: 8px;
      bottom: -1px;
      right: -1px;
    }

    /* Companion Overview */
    .companion-overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }

    .companion-overview-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 2px solid transparent;
    }

    .companion-avatar-large { font-size: 32px; margin-bottom: 8px; }
    .companion-name { font-size: 14px; font-weight: 600; margin-bottom: 12px; }

    .companion-progress-ring {
      position: relative;
      width: 60px;
      height: 60px;
      margin: 0 auto 8px;
    }

    .companion-progress-ring svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .ring-bg {
      fill: none;
      stroke: var(--progress-bg);
      stroke-width: 3;
    }

    .ring-fill {
      fill: none;
      stroke: #4ade80;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dasharray 0.3s ease;
    }

    .ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      font-weight: 700;
    }

    .companion-stat { font-size: 12px; color: var(--text-secondary); }

    /* Overview Table */
    .overview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .overview-table th,
    .overview-table td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .overview-table th {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 12px;
      text-transform: uppercase;
    }

    .overview-table th:first-child,
    .overview-table td:first-child {
      text-align: left;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overview-table .status-cell { cursor: pointer; font-size: 16px; }
    .overview-table .status-cell:hover { background: rgba(255, 255, 255, 0.1); }

    .item-cat-icon { margin-right: 6px; }

    .progress-card { padding: 24px; margin-bottom: 20px; }

    .progress-stats { display: flex; justify-content: space-between; margin-bottom: 16px; }

    .progress-stat-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
    .progress-stat-value { font-size: 32px; font-weight: 700; }
    .progress-stat-value span { font-size: 20px; color: var(--text-muted); }
    .progress-stat-sub { font-size: 13px; color: var(--text-muted); }

    .list-progress-bar {
      height: 14px;
      background: var(--progress-bg);
      border-radius: 10px;
      overflow: hidden;
    }

    .list-progress-fill {
      height: 100%;
      background: var(--progress-fill);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .complete-msg { text-align: center; margin-top: 16px; font-size: 18px; font-weight: 600; }

    .list-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .list-item-row.checked { background: rgba(255, 255, 255, 0.1); }

    .list-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid var(--card-border);
      color: transparent;
    }

    .list-check:active { transform: scale(0.9); }
    .list-item-row.checked .list-check { background: white; border-color: white; color: #10b981; font-weight: bold; }

    .list-item-info { flex: 1; min-width: 0; }
    .list-item-row.checked .list-item-info { opacity: 0.6; }

    .list-item-name { font-size: 15px; font-weight: 500; }
    .list-item-row.checked .list-item-name { text-decoration: line-through; }
    .list-item-weight { font-size: 13px; color: var(--text-muted); }

    .companion-checks { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

    .companion-check {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 2px solid var(--card-border);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .companion-check:hover { background: var(--card-bg-hover); transform: scale(1.1); }

    .companion-check.checked {
      background: var(--check-bg);
      border-color: var(--check-border);
    }

    .companion-initial { font-size: 12px; font-weight: 600; color: var(--text-primary); text-transform: uppercase; }

    .companion-tick {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      color: #22c55e;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .qty-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: none;
      color: var(--text-primary);
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:active { transform: scale(0.9); }
    .qty-value { width: 24px; text-align: center; font-weight: 600; }

    .delete-btn {
      background: none;
      border: none;
      color: rgba(255, 150, 150, 0.8);
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      flex-shrink: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.3s ease; }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 200;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .tab-btn {
      padding: 10px 16px;
      background: var(--glass-bg);
      border: none;
      border-radius: 20px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active { background: var(--btn-primary-bg); color: var(--btn-primary-text); }

    textarea.text-input {
      min-height: 100px;
      resize: vertical;
    }

    /* Theme Selection Screen */
    .theme-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

// Weather data based on destination and date
const getWeatherData = (destination, startDate) => {
  const dest = (destination || '').toLowerCase();
  const month = startDate ? new Date(startDate).getMonth() : new Date().getMonth();
  const isWinter = month >= 10 || month <= 2;
  const isSummer = month >= 5 && month <= 8;

  // Tropical
  if (dest.match(/bali|thailand|vietnam|indonesia|filipijnen|maleisië/)) {
    return { temp: 30, icon: '🌴', desc: 'Tropisch warm', humidity: 80, rain: 60, climate: 'tropical' };
  }
  // Mediterranean
  if (dest.match(/barcelona|spanje|spain|mallorca|ibiza|italie|italy|rome|griekenland|greece|kreta|portugal/)) {
    return isWinter
      ? { temp: 14, icon: '🌤️', desc: 'Mild', humidity: 65, rain: 30, climate: 'mild' }
      : { temp: 28, icon: '☀️', desc: 'Zonnig & warm', humidity: 55, rain: 10, climate: 'hot' };
  }
  // Scandinavia
  if (dest.match(/noorwegen|norway|zweden|sweden|finland|ijsland|iceland|denemarken/)) {
    return isWinter
      ? { temp: -5, icon: '❄️', desc: 'Koud & sneeuw', humidity: 80, rain: 40, climate: 'cold' }
      : { temp: 15, icon: '🌤️', desc: 'Fris', humidity: 70, rain: 35, climate: 'mild' };
  }
  // West Europe cities
  if (dest.match(/paris|parijs|london|londen|amsterdam|brussel|berlin|berlijn/)) {
    return isWinter
      ? { temp: 6, icon: '🌧️', desc: 'Koel & nat', humidity: 85, rain: 60, climate: 'variable' }
      : { temp: 22, icon: '🌤️', desc: 'Aangenaam', humidity: 60, rain: 30, climate: 'mild' };
  }
  // USA
  if (dest.match(/new york|nyc|los angeles|la|miami|california|florida/)) {
    if (dest.match(/miami|florida/)) {
      return { temp: 28, icon: '☀️', desc: 'Warm & vochtig', humidity: 75, rain: 40, climate: 'tropical' };
    }
    return isWinter
      ? { temp: 2, icon: '❄️', desc: 'Koud', humidity: 65, rain: 35, climate: 'cold' }
      : { temp: 28, icon: '☀️', desc: 'Warm', humidity: 70, rain: 40, climate: 'hot' };
  }
  // Default
  return { temp: 20, icon: '🌤️', desc: 'Aangenaam', humidity: 60, rain: 25, climate: 'mild' };
};

// Calculate trip duration from dates
const calcDuration = (destinations) => {
  if (!destinations || destinations.length === 0) return { days: 0, label: 'weekend' };

  let minDate = null, maxDate = null;
  destinations.forEach(d => {
    if (d.startDate) {
      const start = new Date(d.startDate);
      if (!minDate || start < minDate) minDate = start;
    }
    if (d.endDate) {
      const end = new Date(d.endDate);
      if (!maxDate || end > maxDate) maxDate = end;
    }
  });

  if (!minDate || !maxDate) return { days: 0, label: 'weekend' };

  const days = Math.ceil((maxDate - minDate) / (1000 * 60 * 60 * 24)) + 1;
  let label = 'weekend';
  if (days <= 3) label = 'weekend';
  else if (days <= 7) label = 'week';
  else if (days <= 14) label = 'twoweeks';
  else if (days <= 28) label = 'month';
  else label = 'long';

  return { days, label };
};

// Get combined climate from all destinations
const getCombinedClimate = (destinations) => {
  if (!destinations || destinations.length === 0) return 'mild';

  const climates = destinations.map(d => {
    const weather = getWeatherData(d.name, d.startDate);
    return weather.climate;
  });

  // Priority: tropical > hot > cold > variable > mild
  if (climates.includes('tropical')) return 'tropical';
  if (climates.includes('hot')) return 'hot';
  if (climates.includes('cold')) return 'cold';
  if (climates.includes('variable')) return 'variable';
  return 'mild';
};

      todos.push({ id: 'visa', text: `Visum aanvragen voor ${d.name}`, urgent: true, info: 'Kan weken duren!' });
    }

    // Vaccinations
    if (dest.match(/thailand|bali|indonesia|vietnam|india|africa|afrika|brazil|peru|colombia/) && !todos.find(t => t.id === 'vaccinations')) {
      todos.push({ id: 'vaccinations', text: 'Vaccinaties checken bij GGD', urgent: true, info: 'Hepatitis A/B, DTP' });
    }
  });

  if (duration.label === 'month' || duration.label === 'long') {
    todos.push({ id: 'mail', text: 'Post laten vasthouden/doorsturen', urgent: false });
    todos.push({ id: 'plants', text: 'Planten/huisdieren regelen', urgent: false });
  }

  todos.push({ id: 'copies', text: 'Kopieën documenten maken (digitaal)', urgent: false });
  todos.push({ id: 'bank', text: 'Bank informeren over reis', urgent: false });
  todos.push({ id: 'phone', text: 'Buitenlandbundel activeren', urgent: false });

  return todos;
};

const formatWeight = g => g >= 1000 ? `${(g / 1000).toFixed(1)} kg` : `${g}g`;

const getRecommended = (ans) => {
  const r = {};
  const hasKids = (ans.companions || []).some(c => c.type === 'child' || c.type === 'baby');
  const climate = getCombinedClimate(ans.destinations);

  Object.entries(items).forEach(([k, c]) => {
    if (k === 'kids' && !hasKids) return;

    const f = c.items.filter(i => {
      if (i.always) return true;
      if (i.climate && !i.climate.includes(climate)) return false;
      if (i.activities && !i.activities.some(a => (ans.activities || []).includes(a))) return false;
      if (i.tech && !i.tech.some(t => (ans.tech || []).includes(t))) return false;
      if (i.transport && !i.transport.some(t => (ans.transport || []).includes(t))) return false;
      if (i.destination && !i.destination.some(d => (ans.destination || []).includes(d))) return false;
      return true;
    });
    if (f.length > 0) r[k] = { ...c, items: f };
  });
  return r;
};

  const todosChecked = todos.filter(t => state.preTodos[t.id]).length;

  // Calculate packing stats
  let totalW = 0, checkedW = 0, total = 0, checked = 0;
  Object.values(state.list).forEach(c => {
    c.items.forEach(i => {
      const q = i.quantity || 1;
      total += q;
      totalW += i.weight * q;
      if (i.checked) { checked += q; checkedW += i.weight * q; }
    });
  });
  const progress = total > 0 ? (checked / total) * 100 : 0;

  // Calculate companion stats
  const getCompanionStats = (companionIdx) => {
    let totalItems = 0, checkedItems = 0;
    Object.entries(state.list).forEach(([ck, cat]) => {
      cat.items.forEach((it, idx) => {
        totalItems++;
        const key = `${ck}_${idx}`;
        if (state.companionChecks[key]?.[companionIdx]) checkedItems++;
      });
    });
    return { total: totalItems, checked: checkedItems, percent: totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0 };
  };

  let html = `
    <div class="list-screen">
      <div class="container fade-in">
        <div class="list-header">
          <button class="list-back" onclick="backFromList()">← Terug</button>
          <span class="list-title">Reis Dashboard</span>
          <div class="list-actions">
            <button class="action-btn" onclick="openThemeSelector()">🎨</button>
            <button class="action-btn" onclick="shareList()">📤</button>
            <button class="action-btn" onclick="restart()">🔄</button>
          </div>
        </div>

        <div class="list-tabs">
          <button class="list-tab ${state.listTab === 'paklijst' ? 'active' : ''}" onclick="setListTab('paklijst')">
            🧳 Paklijst
          </button>
          <button class="list-tab ${state.listTab === 'overzicht' ? 'active' : ''}" onclick="setListTab('overzicht')">
            📋 Overzicht
            ${todosChecked < todos.length ? `<span class="tab-badge">${todos.length - todosChecked}</span>` : ''}
          </button>
        </div>`;

  // PAKLIJST TAB
  if (state.listTab === 'paklijst') {
    html += `
        <div class="glass progress-card">
          <div class="progress-stats">
            <div>
              <div class="progress-stat-label">Ingepakt</div>
              <div class="progress-stat-value">${checked}<span>/${total}</span></div>
            </div>
            <div style="text-align:right;">
              <div class="progress-stat-label">Gewicht</div>
              <div class="progress-stat-value" style="font-size:24px;">${formatWeight(checkedW)}</div>
              <div class="progress-stat-sub">van ${formatWeight(totalW)}</div>
            </div>
          </div>
          <div class="list-progress-bar">
            <div class="list-progress-fill" style="width:${progress}%"></div>
          </div>
          ${progress === 100 ? '<div class="complete-msg">🎉 Alles ingepakt!</div>' : ''}
        </div>
        <div>`;

    Object.entries(state.list).forEach(([ck, cat]) => {
      const catChecked = cat.items.filter(i => i.checked).length;
      html += `
        <div class="glass category-card">
          <div class="category-header">
            <span class="category-icon">${cat.icon}</span>
            <span class="category-name">${cat.name}</span>
            <span class="category-count">${catChecked}/${cat.items.length}</span>
          </div>
          <div>
            ${cat.items.map((it, idx) => {
              const companionKey = `${ck}_${idx}`;
              const companionChecks = state.companionChecks[companionKey] || {};
              return `
              <div class="list-item-row ${it.checked ? 'checked' : ''}">
                <div class="list-check" onclick="toggleCheck('${ck}',${idx})">${it.checked ? '✔' : ''}</div>
                <div class="list-item-info">
                  <div class="list-item-name">${it.name}${(it.quantity || 1) > 1 ? ` (${it.quantity}x)` : ''}</div>
                  <div class="list-item-weight">${formatWeight(it.weight * (it.quantity || 1))}</div>
                  ${companions.length > 0 ? `
                    <div class="companion-checks">
                      ${companions.map((c, ci) => `
                        <div class="companion-check ${companionChecks[ci] ? 'checked' : ''}"
                             onclick="toggleCompanionCheck('${ck}',${idx},${ci})"
                             title="${c.name}">
                          <span class="companion-initial">${c.name.charAt(0).toUpperCase()}</span>
                          ${companionChecks[ci] ? '<span class="companion-tick">✔</span>' : ''}
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
                <div class="qty-controls">
                  <button class="qty-btn" onclick="changeQty('${ck}',${idx},-1)">−</button>
                  <span class="qty-value">${it.quantity || 1}</span>
                  <button class="qty-btn" onclick="changeQty('${ck}',${idx},1)">+</button>
                </div>
                <button class="delete-btn" onclick="deleteItem('${ck}',${idx})">✕</button>
              </div>`;
            }).join('')}
            <div class="add-item-row" style="padding:12px;">
              <input type="text" class="add-item-input" placeholder="+ Item toevoegen..." id="addlist-${ck}" onkeypress="handleAddListItem(event,'${ck}')">
              <button class="add-item-btn" onclick="addListItem('${ck}')">+</button>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  }

  // OVERZICHT TAB (Pre-trip todos + Companion overview)
  else if (state.listTab === 'overzicht') {
    const urgentTodos = todos.filter(t => t.urgent);
    const normalTodos = todos.filter(t => !t.urgent);

    // Pre-trip preparation section
    html += `
        <div class="glass progress-card">
          <div class="progress-stats">
            <div>
              <div class="progress-stat-label">Voorbereid</div>
              <div class="progress-stat-value">${todosChecked}<span>/${todos.length}</span></div>
            </div>
            <div style="text-align:right;">
              <div class="progress-stat-label">Status</div>
              <div class="progress-stat-value" style="font-size:18px;">${todosChecked === todos.length ? '✅ Klaar!' : '⏳ Bezig'}</div>
            </div>
          </div>
          <div class="list-progress-bar">
            <div class="list-progress-fill" style="width:${todos.length > 0 ? (todosChecked / todos.length) * 100 : 0}%;background:linear-gradient(90deg,#f59e0b,#eab308)"></div>
          </div>
        </div>

        ${urgentTodos.length > 0 ? `
          <div class="glass category-card">
            <div class="category-header">
              <span class="category-icon">🚨</span>
              <span class="category-name">Urgent</span>
              <span class="category-count">${urgentTodos.filter(t => state.preTodos[t.id]).length}/${urgentTodos.length}</span>
            </div>
            <div>
              ${urgentTodos.map(todo => {
                const todoCompanionChecks = state.preTodoCompanionChecks[todo.id] || {};
                return `
                <div class="pretodo-item ${state.preTodos[todo.id] ? 'checked' : ''}">
                  <div class="pretodo-check" onclick="togglePreTodo('${todo.id}')">${state.preTodos[todo.id] ? '✔' : ''}</div>
                  <div class="pretodo-content" onclick="togglePreTodo('${todo.id}')">
                    <div class="pretodo-text">${todo.text}</div>
                    ${todo.info ? `<div class="pretodo-info">${todo.info}</div>` : ''}
                  </div>
                  ${companions.length > 0 ? `
                    <div class="pretodo-companions" onclick="event.stopPropagation()">
                      ${companions.map((c, ci) => `
                        <div class="companion-check small ${todoCompanionChecks[ci] ? 'checked' : ''}"
                             onclick="togglePreTodoCompanion('${todo.id}',${ci})"
                             title="${c.name}">
                          <span class="companion-initial">${c.name.charAt(0).toUpperCase()}</span>
                          ${todoCompanionChecks[ci] ? '<span class="companion-tick">✔</span>' : ''}
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>
        ` : ''}

        ${normalTodos.length > 0 ? `
          <div class="glass category-card">
            <div class="category-header">
              <span class="category-icon">📝</span>
              <span class="category-name">Overige taken</span>
              <span class="category-count">${normalTodos.filter(t => state.preTodos[t.id]).length}/${normalTodos.length}</span>
            </div>
            <div>
              ${normalTodos.map(todo => {
                const todoCompanionChecks = state.preTodoCompanionChecks[todo.id] || {};
                return `
                <div class="pretodo-item ${state.preTodos[todo.id] ? 'checked' : ''}">
                  <div class="pretodo-check" onclick="togglePreTodo('${todo.id}')">${state.preTodos[todo.id] ? '✔' : ''}</div>
                  <div class="pretodo-content" onclick="togglePreTodo('${todo.id}')">
                    <div class="pretodo-text">${todo.text}</div>
                    ${todo.info ? `<div class="pretodo-info">${todo.info}</div>` : ''}
                  </div>
                  ${companions.length > 0 ? `
                    <div class="pretodo-companions" onclick="event.stopPropagation()">
                      ${companions.map((c, ci) => `
                        <div class="companion-check small ${todoCompanionChecks[ci] ? 'checked' : ''}"
                             onclick="togglePreTodoCompanion('${todo.id}',${ci})"
                             title="${c.name}">
                          <span class="companion-initial">${c.name.charAt(0).toUpperCase()}</span>
                          ${todoCompanionChecks[ci] ? '<span class="companion-tick">✔</span>' : ''}
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>
        ` : ''}

        ${companions.length > 0 ? `
        <div class="glass" style="padding:16px;margin-bottom:16px;margin-top:24px;">
          <h3 style="margin:0 0 16px 0;font-size:18px;">👥 Reisgenoten Pakstatus</h3>
          <div class="companion-overview-grid">
            <div class="companion-overview-card" style="border-color:var(--primary);">
              <div class="companion-avatar-large">👤</div>
              <div class="companion-name">Jij</div>
              <div class="companion-progress-ring">
                <svg viewBox="0 0 36 36">
                  <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                  <path class="ring-fill" stroke-dasharray="${progress}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                </svg>
                <span class="ring-text">${Math.round(progress)}%</span>
              </div>
              <div class="companion-stat">${checked}/${total} items</div>
            </div>
            ${companions.map((c, ci) => {
              const stats = getCompanionStats(ci);
              return `
                <div class="companion-overview-card">
                  <div class="companion-avatar-large">${c.type === 'child' ? '👧' : c.type === 'baby' ? '👶' : '👤'}</div>
                  <div class="companion-name">${c.name}</div>
                  <div class="companion-progress-ring">
                    <svg viewBox="0 0 36 36">
                      <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                      <path class="ring-fill" stroke-dasharray="${stats.percent}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <span class="ring-text">${stats.percent}%</span>
                  </div>
                  <div class="companion-stat">${stats.checked}/${stats.total} items</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="glass category-card">
          <div class="category-header">
            <span class="category-icon">📊</span>
            <span class="category-name">Gedetailleerd Overzicht</span>
          </div>
          <div style="overflow-x:auto;">
            <table class="overview-table">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Jij</th>
                  ${companions.map(c => `<th>${c.name}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${Object.entries(state.list).map(([ck, cat]) =>
                  cat.items.map((it, idx) => {
                    const companionKey = `${ck}_${idx}`;
                    const companionChecks = state.companionChecks[companionKey] || {};
                    return `
                      <tr>
                        <td><span class="item-cat-icon">${cat.icon}</span> ${it.name}</td>
                        <td class="status-cell ${it.checked ? 'done' : 'pending'}">${it.checked ? '✅' : '⬜'}</td>
                        ${companions.map((c, ci) => `
                          <td class="status-cell ${companionChecks[ci] ? 'done' : 'pending'}" onclick="toggleCompanionCheck('${ck}',${idx},${ci})">${companionChecks[ci] ? '✅' : '⬜'}</td>
                        `).join('')}
                      </tr>
                    `;
                  }).join('')
                ).join('')}
              </tbody>
            </table>
          </div>
        </div>
        ` : ''}`;
  }

  html += `</div></div>`;
  document.getElementById("app").innerHTML = html;
};

// Event handlers
// Theme functions
window.selectTheme = (theme) => {
  state.theme = theme;
  applyTheme(theme);
  render();
};

window.confirmTheme = () => {
  state.screen = "start";
  render();
};

window.openThemeSelector = () => {
  state.screen = "theme";
  render();
};

window.startQuiz = () => {
  // Clear previous answers when starting fresh
  state.answers = { destinations: [{ name: '', startDate: '', endDate: '' }] };
  state.selected = {};
  state.preTodos = {};
  state.preTodoCompanionChecks = {};
  state.companionChecks = {};
  state.screen = "quiz";
  state.step = 0;
  render();
};
window.resumeList = () => { state.screen = "list"; render(); };
window.goToCommunity = () => { state.screen = "community"; render(); };
window.goToStart = () => { state.screen = "start"; render(); };

window.addDestination = () => {
  state.answers.destinations.push({ name: '', startDate: '', endDate: '' });
  render();
};

window.removeDestination = (idx) => {
  state.answers.destinations.splice(idx, 1);
  render();
};

window.updateDestination = (idx, field, value) => {
  state.answers.destinations[idx][field] = value;
  // Don't render on every keystroke - this destroys the DOM and loses focus
};

window.finishDestinationEdit = (idx, field) => {
  // Called on blur - save state and re-render to update weather preview
  saveState();
  render();
};

window.setListTab = (tab) => { state.listTab = tab; render(); };

window.selectOption = (qid, val, multi) => {
  if (multi) {
    const cur = state.answers[qid] || [];
    state.answers[qid] = cur.includes(val) ? cur.filter(v => v !== val) : [...cur, val];
  } else {
    state.answers[qid] = val;
  }
  render();
};

window.prevStep = () => { if (state.step > 0) { state.step--; render(); } };

window.nextStep = () => {
  const vq = getVisibleQuestions();
  if (state.step < vq.length - 1) { state.step++; render(); }
  else { state.screen = "weather"; render(); }
};

window.backFromWeather = () => { state.screen = "quiz"; render(); };
window.goToPreTodos = () => { state.screen = "pretodos"; render(); };
window.backFromPreTodos = () => { state.screen = "weather"; render(); };
window.goToSuggestions = () => { state.screen = "suggestions"; render(); };
window.backFromSuggestions = () => { state.screen = "pretodos"; render(); };
window.backFromList = () => { state.screen = "suggestions"; render(); };

window.togglePreTodo = (id) => { state.preTodos[id] = !state.preTodos[id]; saveState(); render(); };

window.togglePreTodoCompanion = (todoId, companionIdx) => {
  if (!state.preTodoCompanionChecks[todoId]) state.preTodoCompanionChecks[todoId] = {};
  state.preTodoCompanionChecks[todoId][companionIdx] = !state.preTodoCompanionChecks[todoId][companionIdx];
  saveState();
  render();
};

window.showAddCompanion = () => { state.modal = { type: 'addCompanion', companionType: 'adult' }; render(); };
window.setCompanionType = (type) => { state.modal.companionType = type; render(); };
window.closeModal = (e) => { if (!e || e.target === e.currentTarget) { state.modal = null; render(); } };

window.confirmAddCompanion = () => {
  const name = document.getElementById('companion-name').value.trim();
  if (!name) return;
  if (!state.answers.companions) state.answers.companions = [];
  state.answers.companions.push({ name, type: state.modal.companionType });
  state.modal = null;
  render();
};

window.removeCompanion = (idx) => { state.answers.companions.splice(idx, 1); render(); };

window.toggleItem = (ck, iid) => {
  if (!state.selected[ck]) state.selected[ck] = {};
  state.selected[ck][iid] = !state.selected[ck][iid];
  render();
};

window.addCustomItem = (ck) => {
  const input = document.getElementById(`add-${ck}`);
  const name = input.value.trim();
  if (!name) return;
  if (!state.customItems[ck]) state.customItems[ck] = [];
  const id = 'custom_' + Date.now();
  state.customItems[ck].push({ id, name, weight: 100 });
  if (!state.selected[ck]) state.selected[ck] = {};
  state.selected[ck][id] = true;
  input.value = '';
  render();
};

window.handleAddItem = (e, ck) => { if (e.key === 'Enter') addCustomItem(ck); };

window.addListItem = (ck) => {
  const input = document.getElementById(`addlist-${ck}`);
  const name = input.value.trim();
  if (!name) return;
  state.list[ck].items.push({ id: 'custom_' + Date.now(), name, weight: 100, checked: false, quantity: 1 });
  input.value = '';
  saveState();
  render();
};

window.handleAddListItem = (e, ck) => { if (e.key === 'Enter') addListItem(ck); };

window.createList = () => {
  const rec = getRecommended(state.answers);
  const list = {};

  Object.entries(state.selected).forEach(([ck, its]) => {
    const sel = [];
    Object.entries(its).forEach(([iid, s]) => {
      if (s) {
        let it = rec[ck]?.items.find(i => i.id === iid);
        if (!it && state.customItems[ck]) it = state.customItems[ck].find(i => i.id === iid);
        if (it) sel.push({ ...it, checked: false, quantity: 1 });
      }
    });
    if (sel.length > 0) list[ck] = { name: rec[ck]?.name || 'Custom', icon: rec[ck]?.icon || '📦', items: sel };
  });

  if (Object.keys(list).length === 0) return;
  state.list = list;
  state.screen = "list";
  saveState();
  render();
};

window.toggleCheck = (ck, idx) => { state.list[ck].items[idx].checked = !state.list[ck].items[idx].checked; saveState(); render(); };

window.toggleCompanionCheck = (ck, idx, companionIdx) => {
  const key = `${ck}_${idx}`;
  if (!state.companionChecks[key]) state.companionChecks[key] = {};
  state.companionChecks[key][companionIdx] = !state.companionChecks[key][companionIdx];
  saveState();
  render();
};

window.changeQty = (ck, idx, d) => {
  const it = state.list[ck].items[idx];
  it.quantity = Math.max(1, (it.quantity || 1) + d);
  saveState();
  render();
};

window.deleteItem = (ck, idx) => {
  state.list[ck].items.splice(idx, 1);
  if (state.list[ck].items.length === 0) delete state.list[ck];
  saveState();
  render();
};

window.shareList = async () => {
  let text = '🧳 Mijn Paklijst\n\n';
  Object.entries(state.list).forEach(([ck, cat]) => {
    text += `${cat.icon} ${cat.name}\n`;
    cat.items.forEach(it => {
      text += `${it.checked ? '✅' : '⬜'} ${it.name}${(it.quantity || 1) > 1 ? ` (${it.quantity}x)` : ''}\n`;
    });
    text += '\n';
  });

  if (navigator.share) {
    try { await navigator.share({ title: 'Mijn Paklijst', text }); }
    catch (e) { copyToClipboard(text); }
  } else { copyToClipboard(text); }
};

const copyToClipboard = (text) => {
  navigator.clipboard.writeText(text).then(() => showToast('Gekopieerd!')).catch(() => showToast('Fout'));
};

const showToast = (msg) => {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
};

window.restart = () => {
  if (confirm('Opnieuw beginnen?')) {
    const currentTheme = state.theme; // Preserve theme
    state = { screen: "start", theme: currentTheme, answers: { destinations: [] }, step: 0, selected: {}, list: null, preTodos: {}, preTodoCompanionChecks: {}, modal: null, customItems: {}, likedTips: {}, communityTab: 'tips', companionChecks: {}, listTab: 'paklijst' };
    localStorage.removeItem('paklijst_state_v2');
    render();
  }
};

// Community functions
window.setCommunityTab = (tab) => { state.communityTab = tab; render(); };

window.toggleLike = (id) => {
  state.likedTips[id] = !state.likedTips[id];
  saveState();
  render();
};

window.addTipToList = (id) => {
  const tip = communityTips.find(t => t.id === id);
  if (tip && tip.item) {
    if (!state.customItems.accessories) state.customItems.accessories = [];
    const itemId = 'tip_' + id;
    if (!state.customItems.accessories.find(i => i.id === itemId)) {
      state.customItems.accessories.push({ id: itemId, name: tip.item.name, weight: 50 });
      showToast(`${tip.item.name} toegevoegd!`);
    }
  }
};

window.submitTip = () => {
  const content = document.getElementById('new-tip-content').value.trim();
  if (!content) return;
  showToast('Tip ingediend! (demo)');
  state.communityTab = 'tips';
  render();
};

render();
</script>
</body>
