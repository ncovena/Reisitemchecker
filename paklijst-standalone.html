<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Paklijst Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 50%, #c026d3 100%);
      min-height: 100vh;
      color: white;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
    }

    /* Glass effect */
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
    }

    .glass-dark {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: white;
      color: #7c3aed;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .btn-disabled {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 18px;
      width: auto;
    }

    .btn-small {
      padding: 12px 20px;
      font-size: 14px;
      width: auto;
      display: inline-block;
    }

    /* Start screen */
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .logo {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      margin-bottom: 32px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
    }

    .start-title {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 12px;
      color: white;
    }

    .start-subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* Progress bar */
    .progress-wrapper {
      margin-bottom: 24px;
      padding-top: 8px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    .progress-info strong {
      color: white;
    }

    .progress-bar {
      height: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: white;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Question card */
    .question-card {
      padding: 24px;
      margin-bottom: 100px;
    }

    .question-title {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: white;
    }

    .question-hint {
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 24px;
    }

    /* Options grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .options-grid.single-col {
      grid-template-columns: 1fr;
    }

    /* Option card - UNSELECTED */
    .option-card {
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      min-height: 44px;
    }

    .option-card:active {
      transform: scale(0.97);
    }

    /* Option card - SELECTED */
    .option-card.selected {
      background: white;
      border-color: white;
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.4);
      transform: scale(1.02);
    }

    .option-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .option-label {
      font-size: 16px;
      font-weight: 600;
      color: white;
      margin-bottom: 4px;
    }

    .option-card.selected .option-label {
      color: #7c3aed;
    }

    .option-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .option-card.selected .option-desc {
      color: #a78bfa;
    }

    .option-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: #7c3aed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
    }

    /* Text input styling */
    .text-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 18px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .text-input:focus {
      border-color: white;
      background: rgba(255, 255, 255, 0.2);
    }

    .text-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .date-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    .date-input:focus {
      border-color: white;
      background: rgba(255, 255, 255, 0.2);
    }

    .date-input::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
    }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .bottom-nav-inner {
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }

    .bottom-nav .btn {
      flex: 1;
    }

    /* Weather card */
    .weather-card {
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    .weather-location {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 8px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .weather-icon {
      font-size: 48px;
    }

    .weather-temp {
      font-size: 48px;
      font-weight: 700;
    }

    .weather-desc {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 16px;
    }

    .weather-details {
      display: flex;
      justify-content: space-around;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .weather-detail {
      text-align: center;
    }

    .weather-detail-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .weather-detail-value {
      font-size: 16px;
      font-weight: 600;
    }

    /* Pre-trip todos */
    .pretodo-card {
      padding: 20px;
      margin-bottom: 16px;
    }

    .pretodo-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pretodo-icon {
      font-size: 24px;
    }

    .pretodo-title {
      font-size: 18px;
      font-weight: 700;
      color: white;
    }

    .pretodo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pretodo-item.done {
      background: rgba(34, 197, 94, 0.2);
    }

    .pretodo-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: transparent;
      flex-shrink: 0;
    }

    .pretodo-item.done .pretodo-check {
      background: #22c55e;
      border-color: #22c55e;
      color: white;
    }

    .pretodo-text {
      flex: 1;
      font-size: 14px;
      color: white;
    }

    .pretodo-item.done .pretodo-text {
      text-decoration: line-through;
      opacity: 0.7;
    }

    .pretodo-urgent {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #ef4444;
      color: white;
      font-weight: 600;
    }

    .pretodo-info {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    /* Companions */
    .companion-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .companion-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .companion-info {
      flex: 1;
    }

    .companion-name {
      font-size: 16px;
      font-weight: 600;
      color: white;
    }

    .companion-type {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .companion-remove {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
    }

    .add-companion-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-companion-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: white;
      margin-bottom: 20px;
      text-align: center;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-buttons .btn {
      flex: 1;
    }

    /* Suggestions screen */
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
      padding-top: 16px;
    }

    .page-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      margin-bottom: 20px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: white;
    }

    /* Category card */
    .category-card {
      margin-bottom: 16px;
      overflow: hidden;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .category-icon {
      font-size: 24px;
    }

    .category-name {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      color: white;
    }

    .category-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: white;
    }

    /* Item row */
    .items-container {
      padding: 8px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.05);
    }

    .item-row:active {
      transform: scale(0.98);
    }

    .item-row.selected {
      background: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .item-row.dragging {
      opacity: 0.5;
      transform: scale(1.02);
    }

    .item-row.drag-over {
      border: 2px dashed white;
    }

    .drag-handle {
      cursor: grab;
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
      padding: 4px;
    }

    .item-row.selected .drag-handle {
      color: #a78bfa;
    }

    .item-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: transparent;
    }

    .item-row.selected .item-check {
      background: #7c3aed;
      border-color: #7c3aed;
      color: white;
    }

    .item-name {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
    }

    .item-row.selected .item-name {
      color: #7c3aed;
      font-weight: 600;
    }

    .item-weight {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
    }

    .item-row.selected .item-weight {
      color: #a78bfa;
      font-weight: 600;
    }

    /* Add item input */
    .add-item-row {
      display: flex;
      gap: 8px;
      padding: 8px;
      margin-top: 8px;
    }

    .add-item-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .add-item-input:focus {
      border-color: white;
    }

    .add-item-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .add-item-btn {
      padding: 12px 16px;
      background: white;
      color: #7c3aed;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Packing list screen - green theme */
    .list-screen {
      background: linear-gradient(135deg, #14b8a6 0%, #10b981 50%, #22c55e 100%);
      min-height: 100vh;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      gap: 8px;
    }

    .list-back {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
      padding: 8px;
    }

    .list-title {
      font-size: 20px;
      font-weight: 700;
      color: white;
    }

    .list-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    /* Progress card */
    .progress-card {
      padding: 24px;
      margin-bottom: 20px;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .progress-stat-label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 4px;
    }

    .progress-stat-value {
      font-size: 32px;
      font-weight: 700;
      color: white;
    }

    .progress-stat-value span {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.6);
    }

    .progress-stat-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .list-progress-bar {
      height: 14px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .list-progress-fill {
      height: 100%;
      background: white;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .complete-msg {
      text-align: center;
      margin-top: 16px;
      font-size: 18px;
      font-weight: 600;
      color: white;
    }

    /* Companion tabs */
    .companion-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .companion-tab {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 20px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .companion-tab.active {
      background: white;
      color: #10b981;
    }

    /* List item row */
    .list-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .list-item-row.checked {
      background: rgba(255, 255, 255, 0.1);
    }

    .list-item-row.dragging {
      opacity: 0.5;
    }

    .list-item-row.drag-over {
      background: rgba(255, 255, 255, 0.2);
    }

    .list-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: transparent;
      transition: all 0.2s ease;
    }

    .list-check:active {
      transform: scale(0.9);
    }

    .list-item-row.checked .list-check {
      background: white;
      border-color: white;
      color: #10b981;
      font-weight: bold;
    }

    .list-item-info {
      flex: 1;
      min-width: 0;
    }

    .list-item-row.checked .list-item-info {
      opacity: 0.6;
    }

    .list-item-name {
      font-size: 15px;
      font-weight: 500;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-item-row.checked .list-item-name {
      text-decoration: line-through;
    }

    .list-item-weight {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

// Mock weather data based on destination keywords
const getWeatherData = (destination, startDate) => {
  const dest = (destination || '').toLowerCase();
  const month = startDate ? new Date(startDate).getMonth() : new Date().getMonth();
  const isWinter = month >= 10 || month <= 2;

  // Tropical destinations
  if (dest.includes('bali') || dest.includes('thailand') || dest.includes('vietnam') || dest.includes('indonesia')) {
    return { temp: 30, icon: '🌴', desc: 'Tropisch warm', humidity: 80, rain: 60 };
  }
  // Beach destinations
  if (dest.includes('barcelona') || dest.includes('spain') || dest.includes('spanje') || dest.includes('mallorca') || dest.includes('ibiza')) {
    return isWinter ? { temp: 14, icon: '🌤️', desc: 'Mild', humidity: 65, rain: 30 } : { temp: 28, icon: '☀️', desc: 'Zonnig & warm', humidity: 55, rain: 10 };
  }
  if (dest.includes('greece') || dest.includes('griekenland') || dest.includes('kreta') || dest.includes('rhodes')) {
    return isWinter ? { temp: 12, icon: '🌤️', desc: 'Mild', humidity: 70, rain: 40 } : { temp: 32, icon: '☀️', desc: 'Heet & zonnig', humidity: 45, rain: 5 };
  }
  // Cold destinations
  if (dest.includes('norway') || dest.includes('noorwegen') || dest.includes('iceland') || dest.includes('ijsland') || dest.includes('finland')) {
    return isWinter ? { temp: -5, icon: '❄️', desc: 'Koud & sneeuw', humidity: 80, rain: 40 } : { temp: 15, icon: '🌤️', desc: 'Fris', humidity: 70, rain: 35 };
  }
  // City trips
  if (dest.includes('paris') || dest.includes('parijs') || dest.includes('london') || dest.includes('londen') || dest.includes('amsterdam')) {
    return isWinter ? { temp: 6, icon: '🌧️', desc: 'Koel & regenachtig', humidity: 85, rain: 60 } : { temp: 22, icon: '🌤️', desc: 'Aangenaam', humidity: 60, rain: 30 };
  }
  if (dest.includes('new york') || dest.includes('nyc')) {
    return isWinter ? { temp: 2, icon: '❄️', desc: 'Koud', humidity: 65, rain: 35 } : { temp: 28, icon: '☀️', desc: 'Warm & vochtig', humidity: 70, rain: 40 };
  }
  // Default
  return { temp: 20, icon: '🌤️', desc: 'Aangenaam weer verwacht', humidity: 60, rain: 25 };
};

// Pre-trip todos based on destination and nationality
const getPreTripTodos = (answers) => {
  const todos = [];
  const dest = (answers.destinationName || '').toLowerCase();
  const duration = answers.duration;
  const nationality = answers.nationality;

  // Always needed
  todos.push({ id: 'passport_check', text: 'Paspoort geldigheid checken (min. 6 maanden)', urgent: true });
  todos.push({ id: 'insurance', text: 'Reisverzekering afsluiten', urgent: true });

  // Visa requirements (simplified mock)
  const visaCountries = ['usa', 'amerika', 'united states', 'australia', 'australië', 'china', 'india', 'russia', 'rusland', 'brazil', 'brazilië'];
  if (visaCountries.some(c => dest.includes(c))) {
    todos.push({ id: 'visa', text: 'Visum aanvragen', urgent: true, info: 'Kan weken duren!' });
  }

  // ESTA for USA
  if (dest.includes('usa') || dest.includes('amerika') || dest.includes('united states') || dest.includes('new york') || dest.includes('los angeles') || dest.includes('miami')) {
    if (nationality === 'nl' || nationality === 'be' || nationality === 'de') {
      todos.push({ id: 'esta', text: 'ESTA aanvragen', urgent: true, info: '€21, min. 72u vooraf' });
    }
  }

  // Vaccinations for tropical/exotic destinations
  const vaccinationDests = ['thailand', 'bali', 'indonesia', 'indonesië', 'vietnam', 'india', 'africa', 'afrika', 'brazil', 'brazilië', 'peru', 'colombia'];
  if (vaccinationDests.some(c => dest.includes(c))) {
    todos.push({ id: 'vaccinations', text: 'Vaccinaties checken bij GGD', urgent: true, info: 'Hepatitis A/B, DTP' });
    todos.push({ id: 'malaria', text: 'Malariapillen overwegen', urgent: false });
  }

  // Long trips
  if (duration === 'month' || duration === 'long') {
    todos.push({ id: 'mail', text: 'Post laten vasthouden/doorsturen', urgent: false });
    todos.push({ id: 'bills', text: 'Automatische betalingen checken', urgent: false });
    todos.push({ id: 'plants', text: 'Planten/huisdieren regelen', urgent: false });
  }

  // General
  todos.push({ id: 'copies', text: 'Kopieën documenten maken (digitaal)', urgent: false });
  todos.push({ id: 'bank', text: 'Bank informeren over reis', urgent: false });
  todos.push({ id: 'phone', text: 'Buitenlandbundel activeren', urgent: false });

  return todos;
};

const formatWeight = g => g >= 1000 ? `${(g/1000).toFixed(1)} kg` : `${g}g`;

const getRecommended = (ans) => {
  const r = {};
  const hasKids = (ans.companions || []).some(c => c.type === 'child' || c.type === 'baby');

  Object.entries(items).forEach(([k, c]) => {
    // Skip kids category if no kids
    if (k === 'kids' && !hasKids) return;

    const f = c.items.filter(i => {
      if (i.always) return true;
      if (i.climate && !i.climate.includes(ans.climate)) return false;
      if (i.activities && !i.activities.some(a => (ans.activities || []).includes(a))) return false;
      if (i.tech && !i.tech.some(t => (ans.tech || []).includes(t))) return false;
      if (i.transport && !i.transport.some(t => (ans.transport || []).includes(t))) return false;
      if (i.destination && !i.destination.some(d => (ans.destination || []).includes(d))) return false;
      return true;
    });
    if (f.length > 0) r[k] = { ...c, items: f };
  });
  return r;
};

const render = () => {

    app.innerHTML = `

  }
  else if (state.screen === "quiz") { renderQuiz(); }
  else if (state.screen === "weather") { renderWeather(); }
  else if (state.screen === "pretodos") { renderPreTodos(); }
  else if (state.screen === "suggestions") { renderSuggestions(); }
  else if (state.screen === "list") { renderList(); }

  if (state.modal) { renderModal(); }
};

const getVisibleQuestions = () => questions.filter(q => !q.condition || q.condition(state.answers));

const renderQuiz = () => {
  const vq = getVisibleQuestions();
  const q = vq[state.step];
  const progress = ((state.step + 1) / vq.length) * 100;
  const isMulti = q.type === "multiple";
  const ans = state.answers[q.id];

  let canNext = false;
  if (q.type === 'text') canNext = ans && ans.trim().length > 0;
  else if (q.type === 'dates') canNext = state.answers.startDate;
  else if (q.type === 'companions') canNext = true; // Optional
  else if (isMulti) canNext = ans && ans.length > 0;
  else canNext = !!ans;

  let content = '';

  if (q.type === 'text') {
    content = `
      <div class="input-group">
        <input type="text" class="text-input" placeholder="${q.placeholder || ''}"
          value="${ans || ''}" oninput="updateText('${q.id}', this.value)" autofocus>
      </div>`;
  } else if (q.type === 'dates') {
    content = `
      <div class="input-group">
        <label class="input-label">Vertrek</label>
        <input type="date" class="date-input" value="${state.answers.startDate || ''}"
          onchange="updateDate('startDate', this.value)">
      </div>
      <div class="input-group">
        <label class="input-label">Terug</label>
        <input type="date" class="date-input" value="${state.answers.endDate || ''}"
          onchange="updateDate('endDate', this.value)">
      </div>`;
  } else if (q.type === 'companions') {
    const companions = state.answers.companions || [];
    content = `
      <div class="companions-list">
        ${companions.map((c, i) => `
          <div class="companion-card">
            <div class="companion-avatar">${c.type === 'baby' ? '👶' : c.type === 'child' ? '🧒' : '👤'}</div>
            <div class="companion-info">
              <div class="companion-name">${c.name}</div>
              <div class="companion-type">${c.type === 'adult' ? 'Volwassene' : c.type === 'child' ? 'Kind' : 'Baby'}</div>
            </div>
            <button class="companion-remove" onclick="removeCompanion(${i})">✕</button>
          </div>
        `).join('')}
        <div class="add-companion-btn" onclick="showAddCompanion()">
          <span>➕</span> Reisgenoot toevoegen
        </div>
      </div>`;
  } else {
    content = `
      <div class="options-grid">
        ${q.options.map(o => {
          const sel = isMulti ? (ans || []).includes(o.value) : ans === o.value;
          return `
            <div class="option-card ${sel ? 'selected' : ''}" onclick="selectOption('${q.id}','${o.value}',${isMulti})">
              ${sel ? '<div class="option-check">✓</div>' : ''}
              <div class="option-icon">${o.icon}</div>
              <div class="option-label">${o.label}</div>
              <div class="option-desc">${o.desc || ''}</div>
            </div>`;
        }).join('')}
      </div>`;
  }

  document.getElementById("app").innerHTML = `
    <div class="container fade-in">
      <div class="progress-wrapper">
        <div class="progress-info">
          <span>Stap ${state.step + 1} van ${vq.length}</span>
          <strong>${Math.round(progress)}%</strong>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${progress}%"></div>
        </div>
      </div>

      <div class="glass question-card">
        <h2 class="question-title">${q.question}</h2>
        <p class="question-hint">${q.hint || (isMulti ? 'Tik om te selecteren (meerdere mogelijk)' : 'Kies één optie')}</p>
        ${content}
      </div>
    </div>

    <div class="bottom-nav glass-dark">
      <div class="bottom-nav-inner">
        ${state.step > 0 ? '<button class="btn btn-back" onclick="prevStep()">←</button>' : ''}
        <button class="btn ${canNext ? 'btn-primary' : 'btn-disabled'}" onclick="nextStep()">
          ${state.step === vq.length - 1 ? 'Bekijk weer & tips →' : 'Volgende →'}
        </button>
      </div>
    </div>`;
};

const renderWeather = () => {
  const weather = getWeatherData(state.answers.destinationName, state.answers.startDate);
  const dest = state.answers.destinationName || 'Je bestemming';

  document.getElementById("app").innerHTML = `
    <div class="container fade-in" style="padding-bottom: 100px;">
      <h1 class="page-title">Weer voorspelling</h1>
      <p class="page-subtitle">Verwacht weer voor ${dest}</p>

      <div class="glass weather-card">
        <div class="weather-location">📍 ${dest}</div>
        <div class="weather-main">
          <span class="weather-icon">${weather.icon}</span>
          <span class="weather-temp">${weather.temp}°C</span>
        </div>
        <div class="weather-desc">${weather.desc}</div>
        <div class="weather-details">
          <div class="weather-detail">
            <div class="weather-detail-label">💧 Luchtvochtigheid</div>
            <div class="weather-detail-value">${weather.humidity}%</div>
          </div>
          <div class="weather-detail">
            <div class="weather-detail-label">🌧️ Kans op regen</div>
            <div class="weather-detail-value">${weather.rain}%</div>
          </div>
        </div>
      </div>

      <div class="glass" style="padding: 16px; margin-bottom: 16px;">
        <p style="font-size: 13px; color: rgba(255,255,255,0.7); text-align: center;">
          ℹ️ Dit is een voorspelling gebaseerd op historische data. Check dichter bij vertrek het actuele weer.
        </p>
      </div>
    </div>

    <div class="bottom-nav glass-dark">
      <div class="bottom-nav-inner">
        <button class="btn btn-back" onclick="backFromWeather()">←</button>
        <button class="btn btn-primary" onclick="goToPreTodos()">Pre-trip checklist →</button>
      </div>
    </div>`;
};

const renderPreTodos = () => {
  const todos = getPreTripTodos(state.answers);

  document.getElementById("app").innerHTML = `
    <div class="container fade-in" style="padding-bottom: 100px;">
      <h1 class="page-title">Voor vertrek</h1>
      <p class="page-subtitle">Regel dit voordat je gaat</p>

      <div class="glass pretodo-card">
        <div class="pretodo-header">
          <span class="pretodo-icon">📋</span>
          <span class="pretodo-title">To-do's</span>
        </div>
        ${todos.map(todo => `
          <div class="pretodo-item ${state.preTodos[todo.id] ? 'done' : ''}" onclick="togglePreTodo('${todo.id}')">
            <div class="pretodo-check">✓</div>
            <span class="pretodo-text">${todo.text}</span>
            ${todo.urgent ? '<span class="pretodo-urgent">Belangrijk</span>' : ''}
            ${todo.info ? `<span class="pretodo-info">${todo.info}</span>` : ''}
          </div>
        `).join('')}
      </div>
    </div>

    <div class="bottom-nav glass-dark">
      <div class="bottom-nav-inner">
        <button class="btn btn-back" onclick="backFromPreTodos()">←</button>
        <button class="btn btn-primary" onclick="goToSuggestions()">Naar paklijst →</button>
      </div>
    </div>`;
};

const renderSuggestions = () => {
  const rec = getRecommended(state.answers);
  let totalW = 0, count = 0;
  Object.entries(state.selected).forEach(([ck, its]) => {
    Object.entries(its).forEach(([iid, sel]) => {
      if (sel) {
        const it = rec[ck]?.items.find(i => i.id === iid);
        if (it) { totalW += it.weight; count++; }
      }
    });
  });

  // Add custom items
  Object.entries(state.customItems).forEach(([ck, its]) => {
    its.forEach(it => {
      if (state.selected[ck]?.[it.id]) {
        totalW += it.weight;
        count++;
      }
    });
  });

  let html = `
    <div class="container fade-in" style="padding-bottom: 100px;">
      <h1 class="page-title">Aanbevolen items</h1>
      <p class="page-subtitle">Tik om items te selecteren voor je paklijst</p>

      <div class="glass stats-bar">
        <div>
          <div class="stat-label">Geselecteerd</div>
          <div class="stat-value">${count}</div>
        </div>
        <div style="text-align: right;">
          <div class="stat-label">Totaal gewicht</div>
          <div class="stat-value">${formatWeight(totalW)}</div>
        </div>
      </div>

      <div>`;

  Object.entries(rec).forEach(([ck, cat]) => {
    const customInCat = state.customItems[ck] || [];
    const allItems = [...cat.items, ...customInCat];
    const selInCat = Object.values(state.selected[ck] || {}).filter(Boolean).length;

    html += `
      <div class="glass category-card">
        <div class="category-header">
          <span class="category-icon">${cat.icon}</span>
          <span class="category-name">${cat.name}</span>
          <span class="category-count">${selInCat}/${allItems.length}</span>
        </div>
        <div class="items-container">
          ${allItems.map(it => {
            const sel = state.selected[ck]?.[it.id];
            return `
              <div class="item-row ${sel ? 'selected' : ''}"
                onclick="toggleItem('${ck}','${it.id}')"
                draggable="true"
                ondragstart="dragStart(event,'${ck}','${it.id}')"
                ondragover="dragOver(event)"
                ondrop="drop(event,'${ck}','${it.id}')">
                <span class="drag-handle">⋮⋮</span>
                <div class="item-check">✓</div>
                <span class="item-name">${it.name}</span>
                <span class="item-weight">${formatWeight(it.weight)}</span>
              </div>`;
          }).join('')}
        </div>
        <div class="add-item-row">
          <input type="text" class="add-item-input" placeholder="+ Item toevoegen..."
            id="add-${ck}" onkeypress="handleAddItem(event, '${ck}')">
          <button class="add-item-btn" onclick="addCustomItem('${ck}')">+</button>
        </div>
      </div>`;
  });

  html += `</div></div>
    <div class="bottom-nav glass-dark">
      <div class="bottom-nav-inner">
        <button class="btn btn-back" onclick="backFromSuggestions()">←</button>
        <button class="btn ${count > 0 ? 'btn-primary' : 'btn-disabled'}" onclick="createList()">
          Maak paklijst (${count} items) →
        </button>
      </div>
    </div>`;

  document.getElementById("app").innerHTML = html;
};

const renderList = () => {
  const companions = state.answers.companions || [];
  const showTabs = companions.length > 0;

  let totalW = 0, checkedW = 0, total = 0, checked = 0;
  Object.values(state.list).forEach(c => {
    c.items.forEach(i => {
      const q = i.quantity || 1;
      total += q;
      totalW += i.weight * q;
      if (i.checked) { checked += q; checkedW += i.weight * q; }
    });
  });
  const progress = total > 0 ? (checked / total) * 100 : 0;

  let html = `
    <div class="list-screen">
      <div class="container fade-in">
        <div class="list-header">
          <button class="list-back" onclick="backFromList()">← Terug</button>
          <span class="list-title">Mijn Paklijst</span>
          <div class="list-actions">
            <button class="action-btn" onclick="shareList()" title="Delen">📤</button>
            <button class="action-btn" onclick="restart()" title="Opnieuw">🔄</button>
          </div>
        </div>

        ${showTabs ? `
          <div class="companion-tabs">
            <button class="companion-tab ${state.activeCompanion === 'all' ? 'active' : ''}" onclick="setActiveCompanion('all')">Alles</button>
            <button class="companion-tab ${state.activeCompanion === 'me' ? 'active' : ''}" onclick="setActiveCompanion('me')">Ik</button>
            ${companions.map((c, i) => `
              <button class="companion-tab ${state.activeCompanion === i ? 'active' : ''}" onclick="setActiveCompanion(${i})">${c.name}</button>
            `).join('')}
          </div>
        ` : ''}

        <div class="glass progress-card">
          <div class="progress-stats">
            <div>
              <div class="progress-stat-label">Ingepakt</div>
              <div class="progress-stat-value">${checked}<span>/${total}</span></div>
            </div>
            <div style="text-align: right;">
              <div class="progress-stat-label">Gewicht</div>
              <div class="progress-stat-value" style="font-size: 24px;">${formatWeight(checkedW)}</div>
              <div class="progress-stat-sub">van ${formatWeight(totalW)}</div>
            </div>
          </div>
          <div class="list-progress-bar">
            <div class="list-progress-fill" style="width: ${progress}%"></div>
          </div>
          ${progress === 100 ? '<div class="complete-msg">🎉 Alles ingepakt! Goede reis!</div>' : ''}
        </div>

        <div>`;

  Object.entries(state.list).forEach(([ck, cat]) => {
    const catChecked = cat.items.filter(i => i.checked).length;
    html += `
      <div class="glass category-card">
        <div class="category-header">
          <span class="category-icon">${cat.icon}</span>
          <span class="category-name">${cat.name}</span>
          <span class="category-count">${catChecked}/${cat.items.length}</span>
        </div>
        <div>
          ${cat.items.map((it, idx) => `
            <div class="list-item-row ${it.checked ? 'checked' : ''}"
              draggable="true"
              ondragstart="dragStartList(event,'${ck}',${idx})"
              ondragover="dragOver(event)"
              ondrop="dropList(event,'${ck}',${idx})">
              <div class="list-check" onclick="toggleCheck('${ck}',${idx})">${it.checked ? '✓' : ''}</div>
              <div class="list-item-info">
                <div class="list-item-name">${it.name}${(it.quantity || 1) > 1 ? ` (${it.quantity}x)` : ''}</div>
                <div class="list-item-weight">${formatWeight(it.weight * (it.quantity || 1))}</div>
              </div>
              <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty('${ck}',${idx},-1)">−</button>
                <span class="qty-value">${it.quantity || 1}</span>
                <button class="qty-btn" onclick="changeQty('${ck}',${idx},1)">+</button>
              </div>
              <button class="delete-btn" onclick="deleteItem('${ck}',${idx})">✕</button>
            </div>`).join('')}
          <div class="add-item-row" style="padding: 12px;">
            <input type="text" class="add-item-input" placeholder="+ Item toevoegen..."
              id="addlist-${ck}" onkeypress="handleAddListItem(event, '${ck}')">
            <button class="add-item-btn" onclick="addListItem('${ck}')">+</button>
          </div>
        </div>
      </div>`;
  });

  html += `</div></div></div>`;
  document.getElementById("app").innerHTML = html;
};

const renderModal = () => {
  const modal = state.modal;
  let modalHtml = '';

  if (modal.type === 'addCompanion') {
    modalHtml = `
      <div class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <h3 class="modal-title">Reisgenoot toevoegen</h3>
          <div class="input-group">
            <label class="input-label">Naam</label>
            <input type="text" class="text-input" id="companion-name" placeholder="Naam">
          </div>
          <div class="input-group">
            <label class="input-label">Type</label>
            <div class="options-grid single-col">
              <div class="option-card ${modal.companionType === 'adult' ? 'selected' : ''}" onclick="setCompanionType('adult')">
                <span class="option-icon">👤</span>
                <span class="option-label">Volwassene</span>
              </div>
              <div class="option-card ${modal.companionType === 'child' ? 'selected' : ''}" onclick="setCompanionType('child')">
                <span class="option-icon">🧒</span>
                <span class="option-label">Kind (2-12 jaar)</span>
              </div>
              <div class="option-card ${modal.companionType === 'baby' ? 'selected' : ''}" onclick="setCompanionType('baby')">
                <span class="option-icon">👶</span>
                <span class="option-label">Baby (0-2 jaar)</span>
              </div>
            </div>
          </div>
          <div class="modal-buttons">
            <button class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
            <button class="btn btn-primary" onclick="confirmAddCompanion()">Toevoegen</button>
          </div>
        </div>
      </div>`;
  }

  document.getElementById("app").insertAdjacentHTML('beforeend', modalHtml);
};

// Event handlers
window.startQuiz = () => { state.screen = "quiz"; state.step = 0; render(); };
window.resumeList = () => { state.screen = "list"; render(); };

window.selectOption = (qid, val, multi) => {
  if (multi) {
    const cur = state.answers[qid] || [];
    state.answers[qid] = cur.includes(val) ? cur.filter(v => v !== val) : [...cur, val];
  } else {
    state.answers[qid] = val;
  }
  render();
};

window.updateText = (qid, val) => { state.answers[qid] = val; };
window.updateDate = (field, val) => { state.answers[field] = val; render(); };

window.prevStep = () => { if (state.step > 0) { state.step--; render(); } };

window.nextStep = () => {
  const vq = getVisibleQuestions();
  const q = vq[state.step];
  const isMulti = q.type === "multiple";
  const ans = state.answers[q.id];

  let canNext = false;
  if (q.type === 'text') canNext = ans && ans.trim().length > 0;
  else if (q.type === 'dates') canNext = state.answers.startDate;
  else if (q.type === 'companions') canNext = true;
  else if (isMulti) canNext = ans && ans.length > 0;
  else canNext = !!ans;

  if (!canNext) return;
  if (state.step < vq.length - 1) { state.step++; render(); }
  else { state.screen = "weather"; render(); }
};

window.backFromWeather = () => { state.screen = "quiz"; render(); };
window.goToPreTodos = () => { state.screen = "pretodos"; render(); };
window.backFromPreTodos = () => { state.screen = "weather"; render(); };
window.goToSuggestions = () => { state.screen = "suggestions"; render(); };
window.backFromSuggestions = () => { state.screen = "pretodos"; render(); };
window.backFromList = () => { state.screen = "suggestions"; render(); };

window.togglePreTodo = (id) => {
  state.preTodos[id] = !state.preTodos[id];
  saveState();
  render();
};

window.showAddCompanion = () => {
  state.modal = { type: 'addCompanion', companionType: 'adult' };
  render();
};

window.setCompanionType = (type) => {
  state.modal.companionType = type;
  render();
};

window.closeModal = (event) => {
  if (!event || event.target === event.currentTarget) {
    state.modal = null;
    render();
  }
};

window.confirmAddCompanion = () => {
  const name = document.getElementById('companion-name').value.trim();
  if (!name) return;

  if (!state.answers.companions) state.answers.companions = [];
  state.answers.companions.push({ name, type: state.modal.companionType });
  state.modal = null;
  render();
};

window.removeCompanion = (idx) => {
  state.answers.companions.splice(idx, 1);
  render();
};

window.toggleItem = (ck, iid) => {
  if (!state.selected[ck]) state.selected[ck] = {};
  state.selected[ck][iid] = !state.selected[ck][iid];
  render();
};

window.addCustomItem = (ck) => {
  const input = document.getElementById(`add-${ck}`);
  const name = input.value.trim();
  if (!name) return;

  if (!state.customItems[ck]) state.customItems[ck] = [];
  const id = 'custom_' + Date.now();
  state.customItems[ck].push({ id, name, weight: 100 });

  if (!state.selected[ck]) state.selected[ck] = {};
  state.selected[ck][id] = true;

  input.value = '';
  render();
};

window.handleAddItem = (e, ck) => {
  if (e.key === 'Enter') addCustomItem(ck);
};

window.addListItem = (ck) => {
  const input = document.getElementById(`addlist-${ck}`);
  const name = input.value.trim();
  if (!name) return;

  state.list[ck].items.push({ id: 'custom_' + Date.now(), name, weight: 100, checked: false, quantity: 1 });
  input.value = '';
  saveState();
  render();
};

window.handleAddListItem = (e, ck) => {
  if (e.key === 'Enter') addListItem(ck);
};

// Drag and drop
let dragData = null;

window.dragStart = (e, ck, iid) => {
  dragData = { ck, iid, type: 'suggestion' };
  e.target.classList.add('dragging');
};

window.dragStartList = (e, ck, idx) => {
  dragData = { ck, idx, type: 'list' };
  e.target.classList.add('dragging');
};

window.dragOver = (e) => {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
};

window.drop = (e, ck, iid) => {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  // For now just visual feedback, could implement reordering
  dragData = null;
  render();
};

window.dropList = (e, ck, idx) => {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragData && dragData.type === 'list' && dragData.ck === ck) {
    const items = state.list[ck].items;
    const [moved] = items.splice(dragData.idx, 1);
    items.splice(idx, 0, moved);
    saveState();
  }
  dragData = null;
  render();
};

window.createList = () => {
  const rec = getRecommended(state.answers);
  const list = {};

  Object.entries(state.selected).forEach(([ck, its]) => {
    const sel = [];
    Object.entries(its).forEach(([iid, s]) => {
      if (s) {
        // Check in recommended items
        let it = rec[ck]?.items.find(i => i.id === iid);
        // Check in custom items
        if (!it && state.customItems[ck]) {
          it = state.customItems[ck].find(i => i.id === iid);
        }
        if (it) sel.push({ ...it, checked: false, quantity: 1 });
      }
    });
    if (sel.length > 0) list[ck] = { name: rec[ck]?.name || 'Custom', icon: rec[ck]?.icon || '📦', items: sel };
  });

  if (Object.keys(list).length === 0) return;
  state.list = list;
  state.screen = "list";
  saveState();
  render();
};

window.toggleCheck = (ck, idx) => {
  state.list[ck].items[idx].checked = !state.list[ck].items[idx].checked;
  saveState();
  render();
};

window.changeQty = (ck, idx, d) => {
  const it = state.list[ck].items[idx];
  it.quantity = Math.max(1, (it.quantity || 1) + d);
  saveState();
  render();
};

window.deleteItem = (ck, idx) => {
  state.list[ck].items.splice(idx, 1);
  if (state.list[ck].items.length === 0) delete state.list[ck];
  saveState();
  render();
};

window.setActiveCompanion = (c) => {
  state.activeCompanion = c;
  render();
};

window.shareList = async () => {
  let text = '🧳 Mijn Paklijst\n\n';
  Object.entries(state.list).forEach(([ck, cat]) => {
    text += `${cat.icon} ${cat.name}\n`;
    cat.items.forEach(it => {
      const check = it.checked ? '✅' : '⬜';
      text += `${check} ${it.name}${(it.quantity || 1) > 1 ? ` (${it.quantity}x)` : ''}\n`;
    });
    text += '\n';
  });

  if (navigator.share) {
    try {
      await navigator.share({ title: 'Mijn Paklijst', text });
    } catch(e) {
      copyToClipboard(text);
    }
  } else {
    copyToClipboard(text);
  }
};

const copyToClipboard = (text) => {
  navigator.clipboard.writeText(text).then(() => {
    showToast('Gekopieerd naar klembord!');
  }).catch(() => {
    showToast('Kon niet kopiëren');
  });
};

const showToast = (msg) => {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
};

window.restart = () => {
  if (confirm('Opnieuw beginnen? Je paklijst wordt gewist.')) {
    state = { screen: "start", answers: {}, step: 0, selected: {}, list: null, preTodos: {}, activeCompanion: 'all', modal: null, customItems: {} };
    localStorage.removeItem('paklijst_state');
    render();
  }
};

render();
</script>
</body>
</html>
