<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Paklijst Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 50%, #c026d3 100%);
      min-height: 100vh;
      color: white;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
    }

    /* Glass effect */
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
    }

    .glass-dark {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: white;
      color: #7c3aed;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .btn-disabled {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 18px;
      width: auto;
    }

    /* Start screen */
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .logo {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      margin-bottom: 32px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
    }

    .start-title {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 12px;
      color: white;
    }

    .start-subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* Progress bar */
    .progress-wrapper {
      margin-bottom: 24px;
      padding-top: 8px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    .progress-info strong {
      color: white;
    }

    .progress-bar {
      height: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: white;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Question card */
    .question-card {
      padding: 24px;
      margin-bottom: 100px;
    }

    .question-title {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: white;
    }

    .question-hint {
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 24px;
    }

    /* Options grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Option card - UNSELECTED */
    .option-card {
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .option-card:active {
      transform: scale(0.97);
    }

    /* Option card - SELECTED */
    .option-card.selected {
      background: white;
      border-color: white;
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.4);
      transform: scale(1.02);
    }

    .option-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .option-label {
      font-size: 16px;
      font-weight: 600;
      color: white;
      margin-bottom: 4px;
    }

    .option-card.selected .option-label {
      color: #7c3aed;
    }

    .option-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .option-card.selected .option-desc {
      color: #a78bfa;
    }

    .option-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: #7c3aed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
    }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .bottom-nav-inner {
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }

    .bottom-nav .btn {
      flex: 1;
    }

    /* Suggestions screen */
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
      padding-top: 16px;
    }

    .page-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      margin-bottom: 20px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: white;
    }

    /* Category card */
    .category-card {
      margin-bottom: 16px;
      overflow: hidden;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .category-icon {
      font-size: 24px;
    }

    .category-name {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      color: white;
    }

    .category-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: white;
    }

    /* Item row */
    .items-container {
      padding: 8px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.05);
    }

    .item-row:active {
      transform: scale(0.98);
    }

    .item-row.selected {
      background: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .item-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: transparent;
    }

    .item-row.selected .item-check {
      background: #7c3aed;
      border-color: #7c3aed;
      color: white;
    }

    .item-name {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
    }

    .item-row.selected .item-name {
      color: #7c3aed;
      font-weight: 600;
    }

    .item-weight {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
    }

    .item-row.selected .item-weight {
      color: #a78bfa;
      font-weight: 600;
    }

    /* Packing list screen - green theme */
    .list-screen {
      background: linear-gradient(135deg, #14b8a6 0%, #10b981 50%, #22c55e 100%);
      min-height: 100vh;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
    }

    .list-back {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
    }

    .list-title {
      font-size: 20px;
      font-weight: 700;
      color: white;
    }

    /* Progress card */
    .progress-card {
      padding: 24px;
      margin-bottom: 20px;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .progress-stat-label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 4px;
    }

    .progress-stat-value {
      font-size: 32px;
      font-weight: 700;
      color: white;
    }

    .progress-stat-value span {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.6);
    }

    .progress-stat-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .list-progress-bar {
      height: 14px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .list-progress-fill {
      height: 100%;
      background: white;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .complete-msg {
      text-align: center;
      margin-top: 16px;
      font-size: 18px;
      font-weight: 600;
      color: white;
    }

    /* List item row */
    .list-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .list-item-row.checked {
      background: rgba(255, 255, 255, 0.1);
    }

    .list-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: transparent;
      transition: all 0.2s ease;
    }

    .list-check:active {
      transform: scale(0.9);
    }

    .list-item-row.checked .list-check {
      background: white;
      border-color: white;
      color: #10b981;
      font-weight: bold;
    }

    .list-item-info {
      flex: 1;
      min-width: 0;
    }

    .list-item-row.checked .list-item-info {
      opacity: 0.6;
    }

    .list-item-name {
      font-size: 15px;
      font-weight: 500;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-item-row.checked .list-item-name {
      text-decoration: line-through;
    }

    .list-item-weight {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:active {
      transform: scale(0.9);
    }

    .qty-value {
      width: 24px;
      text-align: center;
      font-weight: 600;
      color: white;
    }

    .delete-btn {
      background: none;
      border: none;
      color: rgba(255, 150, 150, 0.8);
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      flex-shrink: 0;
    }

    .delete-btn:active {
      transform: scale(0.9);
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>

  ]}
};

const formatWeight = g => g >= 1000 ? `${(g/1000).toFixed(1)} kg` : `${g}g`;

const getRecommended = (ans) => {
  const r = {};
  Object.entries(items).forEach(([k, c]) => {
    const f = c.items.filter(i => {
      if (i.always) return true;
      if (i.climate && !i.climate.includes(ans.climate)) return false;
      if (i.activities && !i.activities.some(a => (ans.activities || []).includes(a))) return false;
      if (i.tech && !i.tech.some(t => (ans.tech || []).includes(t))) return false;
      if (i.transport && !i.transport.some(t => (ans.transport || []).includes(t))) return false;
      if (i.destination && !i.destination.some(d => (ans.destination || []).includes(d))) return false;
      return true;
    });
    if (f.length > 0) r[k] = { ...c, items: f };
  });
  return r;
};

let state = { screen: "start", answers: {}, step: 0, selected: {}, list: null };

const render = () => {
  const app = document.getElementById("app");

  if (state.screen === "start") {
    app.innerHTML = `
      <div class="start-screen fade-in">
        <div class="logo">🧳</div>
        <h1 class="start-title">Paklijst</h1>
        <p class="start-subtitle">Slimme paklijst voor jouw reis.<br>Nooit meer iets vergeten.</p>
        <button class="btn btn-primary" onclick="startQuiz()">Start vragenlijst →</button>
      </div>`;
  }
  else if (state.screen === "quiz") { renderQuiz(); }
  else if (state.screen === "suggestions") { renderSuggestions(); }
  else if (state.screen === "list") { renderList(); }
};

const getVisibleQuestions = () => questions.filter(q => !q.condition || q.condition(state.answers));

const renderQuiz = () => {
  const vq = getVisibleQuestions();
  const q = vq[state.step];
  const progress = ((state.step + 1) / vq.length) * 100;
  const isMulti = q.type === "multiple";
  const ans = state.answers[q.id];
  const canNext = isMulti ? (ans && ans.length > 0) : !!ans;

  document.getElementById("app").innerHTML = `
    <div class="container fade-in">
      <div class="progress-wrapper">
        <div class="progress-info">
          <span>Stap ${state.step + 1} van ${vq.length}</span>
          <strong>${Math.round(progress)}%</strong>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${progress}%"></div>
        </div>
      </div>

      <div class="glass question-card">
        <h2 class="question-title">${q.question}</h2>
        <p class="question-hint">${isMulti ? 'Tik om te selecteren (meerdere mogelijk)' : 'Kies één optie'}</p>

        <div class="options-grid">
          ${q.options.map(o => {
            const sel = isMulti ? (ans || []).includes(o.value) : ans === o.value;
            return `
              <div class="option-card ${sel ? 'selected' : ''}" onclick="selectOption('${q.id}','${o.value}',${isMulti})">
                ${sel ? '<div class="option-check">✓</div>' : ''}
                <div class="option-icon">${o.icon}</div>
                <div class="option-label">${o.label}</div>
                <div class="option-desc">${o.desc || ''}</div>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="bottom-nav glass-dark">
      <div class="bottom-nav-inner">
        ${state.step > 0 ? '<button class="btn btn-back" onclick="prevStep()">←</button>' : ''}
        <button class="btn ${canNext ? 'btn-primary' : 'btn-disabled'}" onclick="nextStep()">
          ${state.step === vq.length - 1 ? 'Bekijk suggesties →' : 'Volgende →'}
        </button>
      </div>
    </div>`;
};

const renderSuggestions = () => {
  const rec = getRecommended(state.answers);
  let totalW = 0, count = 0;
  Object.entries(state.selected).forEach(([ck, its]) => {
    Object.entries(its).forEach(([iid, sel]) => {
      if (sel) {
        const it = rec[ck]?.items.find(i => i.id === iid);
        if (it) { totalW += it.weight; count++; }
      }
    });
  });

  let html = `
    <div class="container fade-in" style="padding-bottom: 100px;">
      <h1 class="page-title">Aanbevolen items</h1>
      <p class="page-subtitle">Tik om items te selecteren voor je paklijst</p>

      <div class="glass stats-bar">
        <div>
          <div class="stat-label">Geselecteerd</div>
          <div class="stat-value">${count}</div>
        </div>
        <div style="text-align: right;">
          <div class="stat-label">Totaal gewicht</div>
          <div class="stat-value">${formatWeight(totalW)}</div>
        </div>
      </div>

      <div>`;

  Object.entries(rec).forEach(([ck, cat]) => {
    const selInCat = Object.values(state.selected[ck] || {}).filter(Boolean).length;
    html += `
      <div class="glass category-card">
        <div class="category-header">
          <span class="category-icon">${cat.icon}</span>
          <span class="category-name">${cat.name}</span>
          <span class="category-count">${selInCat}/${cat.items.length}</span>
        </div>
        <div class="items-container">
          ${cat.items.map(it => {
            const sel = state.selected[ck]?.[it.id];
            return `
              <div class="item-row ${sel ? 'selected' : ''}" onclick="toggleItem('${ck}','${it.id}')">
                <div class="item-check">✓</div>
                <span class="item-name">${it.name}</span>
                <span class="item-weight">${formatWeight(it.weight)}</span>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  });

  html += `</div></div>
    <div class="bottom-nav glass-dark">
      <div class="bottom-nav-inner">
        <button class="btn ${count > 0 ? 'btn-primary' : 'btn-disabled'}" onclick="createList()">
          Maak paklijst (${count} items) →
        </button>
      </div>
    </div>`;

  document.getElementById("app").innerHTML = html;
};

const renderList = () => {
  let totalW = 0, checkedW = 0, total = 0, checked = 0;
  Object.values(state.list).forEach(c => {
    c.items.forEach(i => {
      const q = i.quantity || 1;
      total += q;
      totalW += i.weight * q;
      if (i.checked) { checked += q; checkedW += i.weight * q; }
    });
  });
  const progress = total > 0 ? (checked / total) * 100 : 0;

  let html = `
    <div class="list-screen">
      <div class="container fade-in">
        <div class="list-header">
          <button class="list-back" onclick="restart()">← Opnieuw</button>
          <span class="list-title">Mijn Paklijst</span>
          <div style="width: 70px;"></div>
        </div>

        <div class="glass progress-card">
          <div class="progress-stats">
            <div>
              <div class="progress-stat-label">Ingepakt</div>
              <div class="progress-stat-value">${checked}<span>/${total}</span></div>
            </div>
            <div style="text-align: right;">
              <div class="progress-stat-label">Gewicht</div>
              <div class="progress-stat-value" style="font-size: 24px;">${formatWeight(checkedW)}</div>
              <div class="progress-stat-sub">van ${formatWeight(totalW)}</div>
            </div>
          </div>
          <div class="list-progress-bar">
            <div class="list-progress-fill" style="width: ${progress}%"></div>
          </div>
          ${progress === 100 ? '<div class="complete-msg">🎉 Alles ingepakt! Goede reis!</div>' : ''}
        </div>

        <div>`;

  Object.entries(state.list).forEach(([ck, cat]) => {
    const catChecked = cat.items.filter(i => i.checked).length;
    html += `
      <div class="glass category-card">
        <div class="category-header">
          <span class="category-icon">${cat.icon}</span>
          <span class="category-name">${cat.name}</span>
          <span class="category-count">${catChecked}/${cat.items.length}</span>
        </div>
        <div>
          ${cat.items.map((it, idx) => `
            <div class="list-item-row ${it.checked ? 'checked' : ''}">
              <div class="list-check" onclick="toggleCheck('${ck}',${idx})">${it.checked ? '✓' : ''}</div>
              <div class="list-item-info">
                <div class="list-item-name">${it.name}${(it.quantity || 1) > 1 ? ` (${it.quantity}x)` : ''}</div>
                <div class="list-item-weight">${formatWeight(it.weight * (it.quantity || 1))}</div>
              </div>
              <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty('${ck}',${idx},-1)">−</button>
                <span class="qty-value">${it.quantity || 1}</span>
                <button class="qty-btn" onclick="changeQty('${ck}',${idx},1)">+</button>
              </div>
              <button class="delete-btn" onclick="deleteItem('${ck}',${idx})">✕</button>
            </div>`).join('')}
        </div>
      </div>`;
  });

  html += `</div></div></div>`;
  document.getElementById("app").innerHTML = html;
};

window.startQuiz = () => { state.screen = "quiz"; state.step = 0; render(); };

window.selectOption = (qid, val, multi) => {
  if (multi) {
    const cur = state.answers[qid] || [];
    state.answers[qid] = cur.includes(val) ? cur.filter(v => v !== val) : [...cur, val];
  } else {
    state.answers[qid] = val;
  }
  render();
};

window.prevStep = () => { if (state.step > 0) { state.step--; render(); } };

window.nextStep = () => {
  const vq = getVisibleQuestions();
  const q = vq[state.step];
  const isMulti = q.type === "multiple";
  const ans = state.answers[q.id];
  const canNext = isMulti ? (ans && ans.length > 0) : !!ans;
  if (!canNext) return;
  if (state.step < vq.length - 1) { state.step++; render(); }
  else { state.screen = "suggestions"; render(); }
};

window.toggleItem = (ck, iid) => {
  if (!state.selected[ck]) state.selected[ck] = {};
  state.selected[ck][iid] = !state.selected[ck][iid];
  render();
};

window.createList = () => {
  const rec = getRecommended(state.answers);
  const list = {};
  Object.entries(state.selected).forEach(([ck, its]) => {
    const sel = [];
    Object.entries(its).forEach(([iid, s]) => {
      if (s) {
        const it = rec[ck]?.items.find(i => i.id === iid);
        if (it) sel.push({ ...it, checked: false, quantity: 1 });
      }
    });
    if (sel.length > 0) list[ck] = { name: rec[ck].name, icon: rec[ck].icon, items: sel };
  });
  if (Object.keys(list).length === 0) return;
  state.list = list;
  state.screen = "list";
  render();
};

window.toggleCheck = (ck, idx) => {
  state.list[ck].items[idx].checked = !state.list[ck].items[idx].checked;
  render();
};

window.changeQty = (ck, idx, d) => {
  const it = state.list[ck].items[idx];
  it.quantity = Math.max(1, (it.quantity || 1) + d);
  render();
};

window.deleteItem = (ck, idx) => {
  state.list[ck].items.splice(idx, 1);
  if (state.list[ck].items.length === 0) delete state.list[ck];
  render();
};

window.restart = () => {
  if (confirm('Opnieuw beginnen? Je paklijst wordt gewist.')) {
    state = { screen: "start", answers: {}, step: 0, selected: {}, list: null };
    render();
  }
};

render();
</script>
</body>
</html>
