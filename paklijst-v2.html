<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0D9488">
  <title>Paklijst Pro V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════
       PAKLIJST PRO V2 - DESIGN SYSTEM
       Based on Red Dot Award principles & UX Design Brief
       ═══════════════════════════════════════════════════════════════ */

    /* ─────────────────────────────────────────────────────────────────
       CSS VARIABLES - LIGHT MODE (DEFAULT)
       ───────────────────────────────────────────────────────────────── */
    :root {
      /* Backgrounds */
      --bg-primary: #F8FAFC;
      --bg-secondary: #FFFFFF;
      --bg-tertiary: #F1F5F9;
      --bg-elevated: #FFFFFF;

      /* Brand - Calming Teal */
      --brand-primary: #0D9488;
      --brand-secondary: #14B8A6;
      --brand-light: #CCFBF1;
      --brand-dark: #0F766E;
      --brand-gradient: linear-gradient(135deg, #0D9488 0%, #14B8A6 100%);

      /* Accent - Warm Coral/Orange */
      --accent: #F97316;
      --accent-light: #FFEDD5;
      --accent-dark: #EA580C;

      /* Text */
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --text-inverse: #FFFFFF;

      /* Semantic Colors */
      --success: #10B981;
      --success-light: #D1FAE5;
      --success-dark: #059669;
      --warning: #F59E0B;
      --warning-light: #FEF3C7;
      --error: #EF4444;
      --error-light: #FEE2E2;
      --info: #3B82F6;
      --info-light: #DBEAFE;

      /* Borders */
      --border-light: #E2E8F0;
      --border-medium: #CBD5E1;
      --border-dark: #94A3B8;

      /* Shadows */
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
      --shadow-glow: 0 0 20px rgba(13, 148, 136, 0.2);
      --shadow-glow-accent: 0 0 20px rgba(249, 115, 22, 0.2);

      /* Typography */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 1.875rem;
      --text-4xl: 2.25rem;

      /* Spacing (8pt grid) */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;

      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      /* Transitions */
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 500ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    /* ─────────────────────────────────────────────────────────────────
       DARK MODE
       ───────────────────────────────────────────────────────────────── */
    [data-theme="dark"] {
      --bg-primary: #0F172A;
      --bg-secondary: #1E293B;
      --bg-tertiary: #334155;
      --bg-elevated: #1E293B;

      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #64748B;

      --border-light: #334155;
      --border-medium: #475569;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
    }

    /* THEME: CLASSIC (Purple) */
    [data-theme="classic"] {
      --bg-primary: #7c3aed; --bg-secondary: rgba(255,255,255,0.15); --bg-tertiary: rgba(255,255,255,0.1);
      --bg-elevated: rgba(255,255,255,0.12); --text-primary: #fff; --text-secondary: rgba(255,255,255,0.8);
      --text-muted: rgba(255,255,255,0.6); --border-light: rgba(255,255,255,0.2); --brand-primary: #fff;
    }
    [data-theme="classic"] body { background: linear-gradient(135deg, #7c3aed 0%, #9333ea 50%, #c026d3 100%); }
    [data-theme="classic"] .btn-primary { background: #fff; color: #7c3aed; }

    /* THEME: OCEAN */
    [data-theme="ocean"] {
      --bg-primary: #0077B6; --bg-secondary: rgba(255,255,255,0.18); --bg-tertiary: rgba(255,255,255,0.12);
      --bg-elevated: rgba(255,255,255,0.15); --text-primary: #fff; --text-secondary: rgba(255,255,255,0.85);
      --text-muted: rgba(255,255,255,0.65); --border-light: rgba(255,255,255,0.25); --brand-primary: #fff;
    }
    [data-theme="ocean"] body { background: linear-gradient(135deg, #0077B6 0%, #00B4D8 50%, #48CAE4 100%); }
    [data-theme="ocean"] .btn-primary { background: #fff; color: #0077B6; }

    /* THEME: SUNSET */
    [data-theme="sunset"] {
      --bg-primary: #F77F00; --bg-secondary: rgba(255,255,255,0.15); --bg-tertiary: rgba(255,255,255,0.1);
      --bg-elevated: rgba(255,255,255,0.12); --text-primary: #fff; --text-secondary: rgba(255,255,255,0.9);
      --text-muted: rgba(255,255,255,0.7); --border-light: rgba(255,255,255,0.22); --brand-primary: #fff;
    }
    [data-theme="sunset"] body { background: linear-gradient(135deg, #F77F00 0%, #FC8621 30%, #D62828 70%, #9D0208 100%); }
    [data-theme="sunset"] .btn-primary { background: #fff; color: #D62828; }

    /* THEME: FOREST */
    [data-theme="forest"] {
      --bg-primary: #2D6A4F; --bg-secondary: rgba(255,255,255,0.15); --bg-tertiary: rgba(255,255,255,0.1);
      --bg-elevated: rgba(255,255,255,0.12); --text-primary: #fff; --text-secondary: rgba(255,255,255,0.85);
      --text-muted: rgba(255,255,255,0.65); --border-light: rgba(255,255,255,0.2); --brand-primary: #fff;
    }
    [data-theme="forest"] body { background: linear-gradient(135deg, #2D6A4F 0%, #40916C 50%, #52B788 100%); }
    [data-theme="forest"] .btn-primary { background: #fff; color: #2D6A4F; }

    /* THEME: MIDNIGHT */
    [data-theme="midnight"] {
      --bg-primary: #1a1a2e; --bg-secondary: rgba(255,255,255,0.08); --bg-tertiary: rgba(255,255,255,0.05);
      --bg-elevated: rgba(255,255,255,0.06); --text-primary: #fff; --text-secondary: rgba(255,255,255,0.8);
      --text-muted: rgba(255,255,255,0.55); --border-light: rgba(255,255,255,0.12); --brand-primary: #e94560;
    }
    [data-theme="midnight"] body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
    [data-theme="midnight"] .btn-primary { background: #e94560; color: #fff; }

    /* THEME: NEON */
    [data-theme="neon"] {
      --bg-primary: #0A0A0A; --bg-secondary: rgba(0,255,255,0.08); --bg-tertiary: rgba(0,255,255,0.05);
      --bg-elevated: rgba(0,255,255,0.05); --text-primary: #fff; --text-secondary: rgba(255,255,255,0.85);
      --text-muted: rgba(255,255,255,0.6); --border-light: rgba(0,255,255,0.25); --brand-primary: #00FFFF;
    }
    [data-theme="neon"] body { background: linear-gradient(135deg, #0A0A0A 0%, #1a0a2e 50%, #0D1B2A 100%); }
    [data-theme="neon"] .btn-primary { background: #00FFFF; color: #0A0A0A; box-shadow: 0 0 20px rgba(0,255,255,0.5); }

    /* THEME: PASTEL */
    [data-theme="pastel"] {
      --bg-primary: #E6E6FA; --bg-secondary: rgba(255,255,255,0.6); --bg-tertiary: rgba(255,255,255,0.4);
      --bg-elevated: rgba(255,255,255,0.5); --text-primary: #4A4A6A; --text-secondary: rgba(74,74,106,0.8);
      --text-muted: rgba(74,74,106,0.6); --border-light: rgba(180,142,173,0.3); --brand-primary: #B48EAD;
    }
    [data-theme="pastel"] body { background: linear-gradient(135deg, #E6E6FA 0%, #FFB7D5 50%, #B5EAD7 100%); }
    [data-theme="pastel"] .btn-primary { background: #fff; color: #B48EAD; }

    /* ─────────────────────────────────────────────────────────────────
       BASE STYLES
       ───────────────────────────────────────────────────────────────── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Container */
    .container {
      max-width: 428px;
      margin: 0 auto;
      padding: 0 var(--space-4);
      min-height: 100vh;
    }

    /* ─────────────────────────────────────────────────────────────────
       TYPOGRAPHY
       ───────────────────────────────────────────────────────────────── */
    h1, .h1 {
      font-size: var(--text-3xl);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    h2, .h2 {
      font-size: var(--text-2xl);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    h3, .h3 {
      font-size: var(--text-xl);
      font-weight: 600;
      line-height: 1.3;
    }

    h4, .h4 {
      font-size: var(--text-lg);
      font-weight: 600;
      line-height: 1.4;
    }

    .text-sm { font-size: var(--text-sm); }
    .text-xs { font-size: var(--text-xs); }
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }
    .text-brand { color: var(--brand-primary); }
    .text-center { text-align: center; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }

    /* ─────────────────────────────────────────────────────────────────
       BUTTONS
       ───────────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-size: var(--text-base);
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      min-height: 48px;
      transition: all var(--transition-fast);
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--brand-gradient);
      color: var(--text-inverse);
      box-shadow: var(--shadow-md), var(--shadow-glow);
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-lg), 0 0 30px rgba(13, 148, 136, 0.3);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-medium);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      background: var(--bg-tertiary);
      border-color: var(--border-dark);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .btn-accent {
      background: var(--accent);
      color: var(--text-inverse);
      box-shadow: var(--shadow-md), var(--shadow-glow-accent);
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      padding: var(--space-2) var(--space-4);
      min-height: 40px;
      font-size: var(--text-sm);
    }

    .btn-lg {
      padding: var(--space-4) var(--space-6);
      min-height: 56px;
      font-size: var(--text-lg);
    }

    .btn-icon {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: var(--radius-full);
    }

    /* ─────────────────────────────────────────────────────────────────
       CARDS
       ───────────────────────────────────────────────────────────────── */
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-base);
    }

    .card-elevated {
      box-shadow: var(--shadow-md);
    }

    .card-interactive {
      cursor: pointer;
    }

    .card-interactive:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-medium);
    }

    .card-interactive:active {
      transform: translateY(0) scale(0.99);
    }

    .card-selected {
      border-color: var(--brand-primary);
      box-shadow: var(--shadow-md), 0 0 0 3px var(--brand-light);
    }

    .card-brand {
      background: var(--brand-gradient);
      border: none;
      color: var(--text-inverse);
    }

    /* ─────────────────────────────────────────────────────────────────
       FORM ELEMENTS
       ───────────────────────────────────────────────────────────────── */
    .input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      font-family: var(--font-family);
      font-size: var(--text-base);
      color: var(--text-primary);
      background: var(--bg-secondary);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      min-height: 48px;
      transition: all var(--transition-fast);
    }

    .input:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-light);
    }

    .input::placeholder {
      color: var(--text-muted);
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon .input {
      padding-left: var(--space-10);
    }

    .input-with-icon .input-icon {
      position: absolute;
      left: var(--space-4);
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: var(--text-lg);
    }

    /* ─────────────────────────────────────────────────────────────────
       CHECKBOX - ANIMATED
       ───────────────────────────────────────────────────────────────── */
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-medium);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      flex-shrink: 0;
      position: relative;
    }

    .checkbox-wrapper:hover .checkbox {
      border-color: var(--brand-primary);
    }

    .checkbox.checked {
      background: var(--success);
      border-color: var(--success);
      animation: checkboxBounce 400ms var(--transition-bounce);
    }

    .checkbox .check-icon {
      color: white;
      font-size: 14px;
      font-weight: bold;
      opacity: 0;
      transform: scale(0) rotate(-45deg);
      transition: all var(--transition-base);
    }

    .checkbox.checked .check-icon {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      animation: checkmarkIn 300ms ease 50ms both;
    }

    .checkbox-label {
      flex: 1;
      font-size: var(--text-base);
      color: var(--text-primary);
      transition: all var(--transition-fast);
    }

    .checkbox.checked + .checkbox-label {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    @keyframes checkboxBounce {
      0% { transform: scale(1); }
      30% { transform: scale(0.85); }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes checkmarkIn {
      0% { opacity: 0; transform: scale(0) rotate(-45deg); }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* ─────────────────────────────────────────────────────────────────
       PROGRESS BAR
       ───────────────────────────────────────────────────────────────── */
    .progress-container {
      background: var(--bg-tertiary);
      border-radius: var(--radius-full);
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--brand-gradient);
      border-radius: var(--radius-full);
      transition: width 400ms cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill.complete {
      background: linear-gradient(90deg, var(--success), #34D399);
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ─────────────────────────────────────────────────────────────────
       CATEGORY SECTION
       ───────────────────────────────────────────────────────────────── */
    .category-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: var(--space-3);
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .category-header:hover {
      background: var(--bg-tertiary);
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .category-icon {
      font-size: var(--text-xl);
    }

    .category-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .category-count {
      font-size: var(--text-sm);
      color: var(--text-muted);
    }

    .category-chevron {
      color: var(--text-muted);
      transition: transform var(--transition-base);
    }

    .category-section.expanded .category-chevron {
      transform: rotate(180deg);
    }

    .category-items {
      border-top: 1px solid var(--border-light);
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--transition-slow);
    }

    .category-section.expanded .category-items {
      max-height: 1000px;
    }

    .category-item {
      display: flex;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition-fast);
    }

    .category-item:last-child {
      border-bottom: none;
    }

    .category-item:hover {
      background: var(--bg-tertiary);
    }

    /* ─────────────────────────────────────────────────────────────────
       TRIP CARD
       ───────────────────────────────────────────────────────────────── */
    .trip-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      cursor: pointer;
      transition: all var(--transition-base);
    }

    .trip-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-xl);
      border-color: var(--brand-primary);
    }

    .trip-header {
      display: flex;
      align-items: flex-start;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .trip-icon {
      width: 56px;
      height: 56px;
      background: var(--brand-light);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-2xl);
    }

    .trip-info {
      flex: 1;
    }

    .trip-destination {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-1);
    }

    .trip-dates {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    .trip-progress {
      margin-top: var(--space-3);
    }

    .trip-progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--space-2);
    }

    .trip-progress-label {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    .trip-progress-value {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--brand-primary);
    }

    /* ─────────────────────────────────────────────────────────────────
       OPTION GRID (Question cards)
       ───────────────────────────────────────────────────────────────── */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-3);
    }

    .option-card {
      background: var(--bg-secondary);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
    }

    .option-card:hover {
      border-color: var(--brand-secondary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .option-card:active {
      transform: scale(0.98);
    }

    .option-card.selected {

  const isWinter = month >= 10 || month <= 2;

  // Tropical destinations
  if (dest.match(/bali|thailand|phuket|bangkok|vietnam|indonesia|maldiven|singapore|kuala/)) {

      : { temp: 28, icon: '☀️', desc: 'Zonnig & warm', climate: 'hot' };

// Pre-trip todos based on answers
const getPreTripTodos = (answers) => {
  const todos = [];
  const nationality = answers.nationality;
  const destination = (answers.destination || '').toLowerCase();

  todos.push({ id: 'passport', text: 'Paspoort geldigheid checken (min. 6 maanden)', urgent: true });
  todos.push({ id: 'insurance', text: 'Reisverzekering afsluiten', urgent: true });

  // ESTA for USA
  if (destination.match(/usa|amerika|new york|los angeles|miami|las vegas|california/)) {
    if (nationality === 'nl' || nationality === 'be' || nationality === 'de') {
      todos.push({ id: 'esta', text: 'ESTA aanvragen', urgent: true, info: '€21, min. 72u vooraf' });
    }
  }

  // Visa for certain countries
  if (destination.match(/australia|australië|china|india|russia|rusland|brazil|brazilië/)) {
    todos.push({ id: 'visa', text: 'Visum aanvragen', urgent: true, info: 'Kan weken duren!' });
  }

  // Vaccinations for tropical destinations
  if (destination.match(/thailand|bali|indonesia|vietnam|india|africa|afrika|brazil|peru|colombia/)) {
    todos.push({ id: 'vaccinations', text: 'Vaccinaties checken bij GGD', urgent: true, info: 'Hepatitis A/B, DTP' });
  }

  todos.push({ id: 'copies', text: 'Kopieën documenten maken (digitaal)', urgent: false });
  todos.push({ id: 'bank', text: 'Bank informeren over reis', urgent: false });
  todos.push({ id: 'phone', text: 'Buitenlandbundel activeren', urgent: false });

  return todos;
};

// Generate filtered packing items based on trip answers
const getFilteredItems = (answers) => {
  const result = {};
  const climate = answers.climate || 'mild';
  const activities = answers.activities || [];
  const tripType = answers.tripType || [];
  const transport = answers.transport || [];
  const accommodation = answers.accommodation || [];

  Object.entries(allItems).forEach(([catKey, category]) => {
    // Check category condition
    if (category.condition && !category.condition(answers)) return;

    const filteredItems = category.items.filter(item => {
      // Always include "always" items
      if (item.always) return true;

      // Check climate filter
      if (item.climate && !item.climate.includes(climate)) return false;

      // Check activities filter
      if (item.activities && !item.activities.some(a => activities.includes(a))) {
        // Only exclude if this item REQUIRES specific activities
        if (!item.optional) return false;
      }

      // Check tripType filter
      if (item.tripType && !item.tripType.some(t => tripType.includes(t))) {
        if (!item.optional) return false;
      }

      // Check transport filter
      if (item.transport && !item.transport.some(t => transport.includes(t))) {
        return false;
      }

      return true;
    });

    if (filteredItems.length > 0) {
      result[catKey] = {
        name: category.name,
        icon: category.icon,
        items: filteredItems.map(item => ({ ...item, packed: false }))
      };
    }
  });

  return result;
};

const formatDate = (dateStr) => {
  if (!dateStr) return "";
  const date = new Date(dateStr);
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
};

const getGreeting = () => {
  const hour = new Date().getHours();
  if (hour < 12) return "Goedemorgen";
  if (hour < 18) return "Goedemiddag";
  return "Goedenavond";
};

const calculateProgress = (items) => {
  let total = 0;
  let packed = 0;
  Object.values(items).forEach(cat => {
    cat.items.forEach(item => {
      total++;
      if (item.packed) packed++;
    });
  });
  return total > 0 ? Math.round((packed / total) * 100) : 0;
};

const renderNewTrip = () => {
  const step = state.newTrip.step;
  // Dynamic steps based on selections
  const notSolo = state.newTrip.travelers.includes('family') || state.newTrip.travelers.includes('friends') || state.newTrip.travelers.includes('couple');
  const hasPlane = state.newTrip.transport.includes('plane');

  // Build dynamic step list
  const steps = [
    { id: 'destination', title: 'Waar ga je naartoe?', subtitle: 'Zoek je bestemming' },
    { id: 'dates', title: 'Wanneer reis je?', subtitle: 'Selecteer je data' },
    { id: 'nationality', title: 'Wat is je nationaliteit?', subtitle: 'Voor visa-vereisten' },
    { id: 'travelers', title: 'Met wie reis je?', subtitle: 'Kies je reisgezelschap' },
    { id: 'companions', title: 'Wie gaan er mee?', subtitle: 'Voeg reisgenoten toe', condition: () => notSolo },
    { id: 'tripType', title: 'Wat voor reis?', subtitle: 'Meerdere mogelijk' },
    { id: 'accommodation', title: 'Waar verblijf je?', subtitle: 'Type accommodatie' },
    { id: 'transport', title: 'Hoe reis je?', subtitle: 'Vervoersmiddel' },
    { id: 'airline', title: 'Welke airline?', subtitle: 'Voor bagagelimieten', condition: () => hasPlane },
    { id: 'activities', title: 'Wat ga je doen?', subtitle: 'Selecteer activiteiten' }
  ].filter(s => !s.condition || s.condition());

  const totalSteps = steps.length;
  const currentStep = steps[step] || steps[0];

  let content = "";
  switch (currentStep.id) {
    case 'destination': content = renderDestinationStep(); break;
    case 'dates': content = renderDatesStep(); break;
    case 'nationality': content = renderNationalityStep(); break;
    case 'travelers': content = renderTravelersStep(); break;
    case 'companions': content = renderCompanionsStep(); break;
    case 'tripType': content = renderTripTypeStep(); break;
    case 'accommodation': content = renderAccommodationStep(); break;
    case 'transport': content = renderTransportStep(); break;
    case 'airline': content = renderAirlineStep(); break;
    case 'activities': content = renderActivitiesStep(); break;
  }

  const isLastStep = step === totalSteps - 1;

  return `
    <div class="container page">
      <div class="header">
        <div class="header-back" onclick="handleBack()">←</div>
        <div class="header-title">Nieuwe reis</div>
        <div style="width: 40px;"></div>
      </div>

      <div class="step-indicator">
        ${Array.from({length: totalSteps}, (_, i) => `
          <div class="step-dot ${i === step ? 'active' : ''} ${i < step ? 'completed' : ''}"></div>
        `).join("")}
      </div>

      <div class="mb-6">
        <h2 class="mb-2">${currentStep.title}</h2>
        <p class="text-secondary">${currentStep.subtitle}</p>
      </div>

      ${content}

      <div class="bottom-spacer"></div>
    </div>

    <div class="bottom-bar">
      <div class="bottom-bar-inner">
        ${step > 0 ? `<button class="btn btn-secondary" onclick="prevStep()">Terug</button>` : ""}
        <button class="btn btn-primary btn-block" onclick="nextStep()" ${!canProceed() ? 'disabled style="opacity:0.5"' : ''}>
          ${isLastStep ? "Maak paklijst" : "Volgende"}
        </button>
      </div>
    </div>
  `;
};

const renderPacking = () => {

  const totalItems = Object.values(trip.items).reduce((acc, cat) => acc + cat.items.length, 0);
  const packedItems = Object.values(trip.items).reduce((acc, cat) => acc + cat.items.filter(i => i.packed).length, 0);

  return `
    <div class="container page">
      <div class="header">
        <div class="header-back" onclick="goHome()">←</div>
        <div class="header-title">${trip.destination.split(",")[0]}</div>

        </div>
        <div class="progress-container" style="height: 10px;">

        <div class="text-sm text-secondary mt-2">${packedItems} van ${totalItems} items ingepakt</div>
      </div>

      ${Object.entries(trip.items).map(([key, category]) => {
        const isExpanded = state.expandedCategories.includes(key);
        const catPacked = category.items.filter(i => i.packed).length;
        const catTotal = category.items.length;

        return `
          <div class="category-section ${isExpanded ? 'expanded' : ''}">
            <div class="category-header" onclick="toggleCategory('${key}')">
              <div class="category-title">
                <span class="category-icon">${category.icon}</span>

            <div class="category-items">
              ${category.items.map((item, idx) => `
                <div class="category-item">
                  <div class="checkbox-wrapper" onclick="toggleItem('${key}', ${idx})">
                    <div class="checkbox ${item.packed ? 'checked' : ''}">
                      <span class="check-icon">✓</span>
                    </div>
                    <span class="checkbox-label">${item.name}</span>
                  </div>

    </div>

    ${progress === 100 ? `
      <div class="bottom-bar">
        <div class="bottom-bar-inner">

};

// Theme handlers
window.selectTheme = (theme) => {
  state.theme = theme;
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("paklijst_v2_theme", theme);
  render();
};

window.confirmTheme = () => {
  state.screen = "home";
  render();
};

window.openThemeSelector = () => {
  state.screen = "themes";
  render();
};

// Companion handlers
window.showAddCompanion = () => {
  state.modal = { type: 'addCompanion', companionType: 'adult' };
  render();
};

window.setCompanionType = (type) => {
  state.modal.companionType = type;
  render();
};

window.closeModal = (e) => {
  if (!e || e.target === e.currentTarget) {
    state.modal = null;
    render();
  }
};

window.confirmAddCompanion = () => {
  const nameInput = document.getElementById('companion-name');
  const name = nameInput ? nameInput.value.trim() : '';
  if (!name) return;
  state.newTrip.companions.push({ name, type: state.modal.companionType });
  state.modal = null;
  render();
};

window.removeCompanion = (idx) => {
  state.newTrip.companions.splice(idx, 1);
  render();
};

// Pre-trip todo handlers
window.togglePreTodo = (id) => {
  state.preTodos[id] = !state.preTodos[id];
  saveState();
  render();
};

window.goToPacking = () => {
  state.screen = "packing";
  render();
};

window.goToPreTodos = () => {
  state.screen = "pretodos";
  render();
};

// Nationality handler
window.selectNationality = (nat) => {
  state.newTrip.nationality = nat;
  render();
};

// Airline handler
window.selectAirline = (airline) => {
  state.newTrip.airline = airline;
  render();
};

window.startNewTrip = () => {
  state.screen = "newtrip";
  state.newTrip = { step: 0, destination: "", startDate: "", endDate: "", nationality: "", travelers: [], companions: [], tripType: [], accommodation: [], transport: [], airline: "", activities: [] };
  render();
};

window.handleBack = () => {
  if (state.newTrip.step > 0) {
    state.newTrip.step--;
    render();
  } else {
    goHome();
  }
};

window.goHome = () => {
  state.screen = "home";
  state.currentTrip = null;
  render();
};

window.goToTemplates = () => {
  state.screen = "templates";
  render();
};

window.updateDestination = (value) => {
  state.newTrip.destination = value;
  state.showAutocomplete = true;
  render();
};

window.selectDestination = (dest) => {
  state.newTrip.destination = dest;
  state.showAutocomplete = false;
  render();
};

window.toggleTripType = (type) => {
  const idx = state.newTrip.tripType.indexOf(type);
  if (idx === -1) {
    state.newTrip.tripType.push(type);
  } else {
    state.newTrip.tripType.splice(idx, 1);
  }
  render();
};

window.toggleTravelers = (traveler) => {
  const idx = state.newTrip.travelers.indexOf(traveler);
  if (idx === -1) {
    state.newTrip.travelers.push(traveler);
  } else {
    state.newTrip.travelers.splice(idx, 1);
  }
  render();
};

window.toggleAccommodation = (acc) => {
  const idx = state.newTrip.accommodation.indexOf(acc);
  if (idx === -1) {
    state.newTrip.accommodation.push(acc);
  } else {
    state.newTrip.accommodation.splice(idx, 1);
  }
  render();
};

window.toggleTransport = (transport) => {
  const idx = state.newTrip.transport.indexOf(transport);
  if (idx === -1) {
    state.newTrip.transport.push(transport);
  } else {
    state.newTrip.transport.splice(idx, 1);
  }
  render();
};

window.toggleActivity = (activity) => {
  const idx = state.newTrip.activities.indexOf(activity);
  if (idx === -1) {
    state.newTrip.activities.push(activity);
  } else {
    state.newTrip.activities.splice(idx, 1);
  }
  render();
};

window.updateStartDate = (value) => {
  state.newTrip.startDate = value;
  updateDaysDisplay();
};

window.updateEndDate = (value) => {
  state.newTrip.endDate = value;
  updateDaysDisplay();
};

window.updateDaysDisplay = () => {
  const daysCard = document.getElementById('daysCard');
  const daysCount = document.getElementById('daysCount');
  const datesDisplay = document.getElementById('datesDisplay');
  const nextBtn = document.querySelector('.bottom-bar .btn-primary');

  if (state.newTrip.startDate && state.newTrip.endDate) {
    const days = calculateDays();
    if (daysCard) daysCard.style.display = 'block';
    if (daysCount) daysCount.textContent = days + ' dagen';
    if (datesDisplay) datesDisplay.textContent = formatDate(state.newTrip.startDate) + ' - ' + formatDate(state.newTrip.endDate);
    if (nextBtn) {
      nextBtn.disabled = false;
      nextBtn.style.opacity = '1';
    }
  } else {
    if (daysCard) daysCard.style.display = 'none';
    if (nextBtn) {
      nextBtn.disabled = true;
      nextBtn.style.opacity = '0.5';
    }
  }
};

window.prevStep = () => {
  // Reset autocomplete state when changing steps
  state.showAutocomplete = false;

  if (state.newTrip.step > 0) {
    state.newTrip.step--;
    render();
  }
};

// Helper to get current steps list
window.getCurrentSteps = () => {
  const notSolo = state.newTrip.travelers.includes('family') || state.newTrip.travelers.includes('friends') || state.newTrip.travelers.includes('couple');
  const hasPlane = state.newTrip.transport.includes('plane');

  return [
    { id: 'destination' },
    { id: 'dates' },
    { id: 'nationality' },
    { id: 'travelers' },
    { id: 'companions', condition: () => notSolo },
    { id: 'tripType' },
    { id: 'accommodation' },
    { id: 'transport' },
    { id: 'airline', condition: () => hasPlane },
    { id: 'activities' }
  ].filter(s => !s.condition || s.condition());
};

window.nextStep = () => {
  state.showAutocomplete = false;

  const steps = getCurrentSteps();
  const isLastStep = state.newTrip.step >= steps.length - 1;

  if (!isLastStep) {
    state.newTrip.step++;
    render();
  } else {
    // Get weather/climate data for destination
    const weather = getWeatherData(state.newTrip.destination, state.newTrip.startDate);

    // Build answers object for smart filtering
    const answers = {
      climate: weather.climate,
      activities: state.newTrip.activities,
      tripType: state.newTrip.tripType,
      transport: state.newTrip.transport,
      accommodation: state.newTrip.accommodation,
      travelers: state.newTrip.travelers,
      nationality: state.newTrip.nationality
    };

    // Create trip with filtered items based on all answers
    const filteredItems = getFilteredItems(answers);

    const newTrip = {
      id: Date.now(),
      destination: state.newTrip.destination,
      icon: tripTypes.find(t => t.value === state.newTrip.tripType[0])?.icon || "✈️",
      startDate: state.newTrip.startDate,
      endDate: state.newTrip.endDate,
      nationality: state.newTrip.nationality,
      tripType: state.newTrip.tripType,
      travelers: state.newTrip.travelers,
      companions: state.newTrip.companions,
      accommodation: state.newTrip.accommodation,
      transport: state.newTrip.transport,
      airline: state.newTrip.airline,
      activities: state.newTrip.activities,
      climate: weather.climate,
      progress: 0,
      items: filteredItems
    };
    state.trips.unshift(newTrip);
    state.currentTrip = newTrip;
    state.screen = "packing";
    saveState();
    render();
  }
};

window.canProceed = () => {
  const steps = getCurrentSteps();
  const currentStep = steps[state.newTrip.step];
  if (!currentStep) return false;

  switch (currentStep.id) {
    case 'destination': return state.newTrip.destination.length > 2;
    case 'dates': return state.newTrip.startDate && state.newTrip.endDate;
    case 'nationality': return !!state.newTrip.nationality;
    case 'travelers': return state.newTrip.travelers.length > 0;
    case 'companions': return true; // Companions are optional
    case 'tripType': return state.newTrip.tripType.length > 0;
    case 'accommodation': return state.newTrip.accommodation.length > 0;
    case 'transport': return state.newTrip.transport.length > 0;
    case 'airline': return !!state.newTrip.airline;
    case 'activities': return true; // Activities are optional
    default: return false;
  }
};

window.calculateDays = () => {
  if (!state.newTrip.startDate || !state.newTrip.endDate) return 0;
  const start = new Date(state.newTrip.startDate);
  const end = new Date(state.newTrip.endDate);
  return Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
};

window.openTrip = (id) => {
  const trip = state.trips.find(t => t.id === id);
  if (trip) {
    state.currentTrip = trip;
    state.screen = "packing";
    render();
  }
};

window.toggleCategory = (key) => {
  const idx = state.expandedCategories.indexOf(key);
  if (idx === -1) {
    state.expandedCategories.push(key);
  } else {
    state.expandedCategories.splice(idx, 1);
  }
  render();
};

window.toggleItem = (categoryKey, itemIdx) => {
  const item = state.currentTrip.items[categoryKey].items[itemIdx];
  item.packed = !item.packed;
  state.currentTrip.progress = calculateProgress(state.currentTrip.items);

  // Update trip in trips array
  const tripIdx = state.trips.findIndex(t => t.id === state.currentTrip.id);
  if (tripIdx !== -1) {
    state.trips[tripIdx] = state.currentTrip;
  }

  saveState();
  render();
};

window.showCelebration = () => {
  state.screen = "celebration";
  render();
};

window.toggleTheme = () => {
  state.theme = state.theme === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", state.theme);
  localStorage.setItem("paklijst_v2_theme", state.theme);
  render();
};

window.useTemplate = (templateId) => {
  // Start new trip with template
  state.newTrip = { step: 0, destination: "", startDate: "", endDate: "", travelers: [], tripType: [], accommodation: [], transport: [], activities: [] };
  state.screen = "newtrip";
  render();
};

window.shareList = () => {
  alert("Delen functie komt binnenkort! 📤");
};

window.saveAsTemplate = () => {
  alert("Template opgeslagen! 📋");
  goHome();
};

window.createConfetti = () => {
  const colors = ["#0D9488", "#F97316", "#10B981", "#3B82F6", "#8B5CF6"];
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDelay = Math.random() * 2 + "s";
    confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
    document.body.appendChild(confetti);

    setTimeout(() => confetti.remove(), 5000);
  }
};

// ─────────────────────────────────────────────────────────────────────────────
// INITIALIZATION
// ─────────────────────────────────────────────────────────────────────────────

// Load saved state
const savedState = localStorage.getItem("paklijst_v2_state");
if (savedState) {
  try {
    const parsed = JSON.parse(savedState);
    state.trips = parsed.trips || state.trips;
  } catch (e) {
    console.log("Could not load saved state");
  }
}

// Initial render
render();

// Close autocomplete on outside click (only re-render if it was open)
document.addEventListener("click", (e) => {
  if (!e.target.closest(".autocomplete-wrapper") && state.showAutocomplete) {
    state.showAutocomplete = false;
    render();
  }
});
</script>
</body>
