<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0D9488">
  <title>Paklijst Pro V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════
       PAKLIJST PRO V2 - DESIGN SYSTEM
       Based on Red Dot Award principles & UX Design Brief
       ═══════════════════════════════════════════════════════════════ */

    /* ─────────────────────────────────────────────────────────────────
       CSS VARIABLES - LIGHT MODE (DEFAULT)
       ───────────────────────────────────────────────────────────────── */
    :root {
      /* Backgrounds */
      --bg-primary: #F8FAFC;
      --bg-secondary: #FFFFFF;
      --bg-tertiary: #F1F5F9;
      --bg-elevated: #FFFFFF;

      /* Brand - Calming Teal */
      --brand-primary: #0D9488;
      --brand-secondary: #14B8A6;
      --brand-light: #CCFBF1;
      --brand-dark: #0F766E;
      --brand-gradient: linear-gradient(135deg, #0D9488 0%, #14B8A6 100%);

      /* Accent - Warm Coral/Orange */
      --accent: #F97316;
      --accent-light: #FFEDD5;
      --accent-dark: #EA580C;

      /* Text */
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --text-inverse: #FFFFFF;

      /* Semantic Colors */
      --success: #10B981;
      --success-light: #D1FAE5;
      --success-dark: #059669;
      --warning: #F59E0B;
      --warning-light: #FEF3C7;
      --error: #EF4444;
      --error-light: #FEE2E2;
      --info: #3B82F6;
      --info-light: #DBEAFE;

      /* Borders */
      --border-light: #E2E8F0;
      --border-medium: #CBD5E1;
      --border-dark: #94A3B8;

      /* Shadows */
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
      --shadow-glow: 0 0 20px rgba(13, 148, 136, 0.2);
      --shadow-glow-accent: 0 0 20px rgba(249, 115, 22, 0.2);

      /* Typography */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 1.875rem;
      --text-4xl: 2.25rem;

      /* Spacing (8pt grid) */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;

      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      /* Transitions */
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 500ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    /* ─────────────────────────────────────────────────────────────────
       DARK MODE
       ───────────────────────────────────────────────────────────────── */
    [data-theme="dark"] {
      --bg-primary: #0F172A;
      --bg-secondary: #1E293B;
      --bg-tertiary: #334155;
      --bg-elevated: #1E293B;

      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #64748B;

      --border-light: #334155;
      --border-medium: #475569;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
    }

    /* ─────────────────────────────────────────────────────────────────
       BASE STYLES
       ───────────────────────────────────────────────────────────────── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Container */
    .container {
      max-width: 428px;
      margin: 0 auto;
      padding: 0 var(--space-4);
      min-height: 100vh;
    }

    /* ─────────────────────────────────────────────────────────────────
       TYPOGRAPHY
       ───────────────────────────────────────────────────────────────── */
    h1, .h1 {
      font-size: var(--text-3xl);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    h2, .h2 {
      font-size: var(--text-2xl);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    h3, .h3 {
      font-size: var(--text-xl);
      font-weight: 600;
      line-height: 1.3;
    }

    h4, .h4 {
      font-size: var(--text-lg);
      font-weight: 600;
      line-height: 1.4;
    }

    .text-sm { font-size: var(--text-sm); }
    .text-xs { font-size: var(--text-xs); }
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }
    .text-brand { color: var(--brand-primary); }
    .text-center { text-align: center; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }

    /* ─────────────────────────────────────────────────────────────────
       BUTTONS
       ───────────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-size: var(--text-base);
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      min-height: 48px;
      transition: all var(--transition-fast);
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--brand-gradient);
      color: var(--text-inverse);
      box-shadow: var(--shadow-md), var(--shadow-glow);
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-lg), 0 0 30px rgba(13, 148, 136, 0.3);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-medium);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      background: var(--bg-tertiary);
      border-color: var(--border-dark);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .btn-accent {
      background: var(--accent);
      color: var(--text-inverse);
      box-shadow: var(--shadow-md), var(--shadow-glow-accent);
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      padding: var(--space-2) var(--space-4);
      min-height: 40px;
      font-size: var(--text-sm);
    }

    .btn-lg {
      padding: var(--space-4) var(--space-6);
      min-height: 56px;
      font-size: var(--text-lg);
    }

    .btn-icon {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: var(--radius-full);
    }

    /* ─────────────────────────────────────────────────────────────────
       CARDS
       ───────────────────────────────────────────────────────────────── */
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-base);
    }

    .card-elevated {
      box-shadow: var(--shadow-md);
    }

    .card-interactive {
      cursor: pointer;
    }

    .card-interactive:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-medium);
    }

    .card-interactive:active {
      transform: translateY(0) scale(0.99);
    }

    .card-selected {
      border-color: var(--brand-primary);
      box-shadow: var(--shadow-md), 0 0 0 3px var(--brand-light);
    }

    .card-brand {
      background: var(--brand-gradient);
      border: none;
      color: var(--text-inverse);
    }

    /* ─────────────────────────────────────────────────────────────────
       FORM ELEMENTS
       ───────────────────────────────────────────────────────────────── */
    .input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      font-family: var(--font-family);
      font-size: var(--text-base);
      color: var(--text-primary);
      background: var(--bg-secondary);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      min-height: 48px;
      transition: all var(--transition-fast);
    }

    .input:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-light);
    }

    .input::placeholder {
      color: var(--text-muted);
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon .input {
      padding-left: var(--space-10);
    }

    .input-with-icon .input-icon {
      position: absolute;
      left: var(--space-4);
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: var(--text-lg);
    }

    /* ─────────────────────────────────────────────────────────────────
       CHECKBOX - ANIMATED
       ───────────────────────────────────────────────────────────────── */
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-medium);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      flex-shrink: 0;
      position: relative;
    }

    .checkbox-wrapper:hover .checkbox {
      border-color: var(--brand-primary);
    }

    .checkbox.checked {
      background: var(--success);
      border-color: var(--success);
      animation: checkboxBounce 400ms var(--transition-bounce);
    }

    .checkbox .check-icon {
      color: white;
      font-size: 14px;
      font-weight: bold;
      opacity: 0;
      transform: scale(0) rotate(-45deg);
      transition: all var(--transition-base);
    }

    .checkbox.checked .check-icon {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      animation: checkmarkIn 300ms ease 50ms both;
    }

    .checkbox-label {
      flex: 1;
      font-size: var(--text-base);
      color: var(--text-primary);
      transition: all var(--transition-fast);
    }

    .checkbox.checked + .checkbox-label {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    @keyframes checkboxBounce {
      0% { transform: scale(1); }
      30% { transform: scale(0.85); }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes checkmarkIn {
      0% { opacity: 0; transform: scale(0) rotate(-45deg); }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* ─────────────────────────────────────────────────────────────────
       PROGRESS BAR
       ───────────────────────────────────────────────────────────────── */
    .progress-container {
      background: var(--bg-tertiary);
      border-radius: var(--radius-full);
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--brand-gradient);
      border-radius: var(--radius-full);
      transition: width 400ms cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill.complete {
      background: linear-gradient(90deg, var(--success), #34D399);
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ─────────────────────────────────────────────────────────────────
       CATEGORY SECTION
       ───────────────────────────────────────────────────────────────── */
    .category-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: var(--space-3);
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .category-header:hover {
      background: var(--bg-tertiary);
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .category-icon {
      font-size: var(--text-xl);
    }

    .category-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .category-count {
      font-size: var(--text-sm);
      color: var(--text-muted);
    }

    .category-chevron {
      color: var(--text-muted);
      transition: transform var(--transition-base);
    }

    .category-section.expanded .category-chevron {
      transform: rotate(180deg);
    }

    .category-items {
      border-top: 1px solid var(--border-light);
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--transition-slow);
    }

    .category-section.expanded .category-items {
      max-height: 1000px;
    }

    .category-item {
      display: flex;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition-fast);
    }

    .category-item:last-child {
      border-bottom: none;
    }

    .category-item:hover {
      background: var(--bg-tertiary);
    }

    /* ─────────────────────────────────────────────────────────────────
       TRIP CARD
       ───────────────────────────────────────────────────────────────── */
    .trip-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      cursor: pointer;
      transition: all var(--transition-base);
    }

    .trip-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-xl);
      border-color: var(--brand-primary);
    }

    .trip-header {
      display: flex;
      align-items: flex-start;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .trip-icon {
      width: 56px;
      height: 56px;
      background: var(--brand-light);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-2xl);
    }

    .trip-info {
      flex: 1;
    }

    .trip-destination {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-1);
    }

    .trip-dates {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    .trip-progress {
      margin-top: var(--space-3);
    }

    .trip-progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--space-2);
    }

    .trip-progress-label {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    .trip-progress-value {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--brand-primary);
    }

    /* ─────────────────────────────────────────────────────────────────
       OPTION GRID (Question cards)
       ───────────────────────────────────────────────────────────────── */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-3);
    }

    .option-card {
      background: var(--bg-secondary);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
    }

    .option-card:hover {
      border-color: var(--brand-secondary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .option-card:active {
      transform: scale(0.98);
    }

    .option-card.selected {
      border-color: var(--brand-primary);
      background: var(--brand-light);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
      animation: selectPop 300ms ease;
    }

    @keyframes selectPop {
      0% { transform: scale(1); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .option-icon {
      font-size: 36px;
      margin-bottom: var(--space-2);
    }

    .option-label {
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--space-1);
    }

    .option-card.selected .option-label {
      color: var(--brand-dark);
    }

    .option-desc {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .option-check {
      position: absolute;
      top: var(--space-2);
      right: var(--space-2);
      width: 24px;
      height: 24px;
      background: var(--brand-primary);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      opacity: 0;
      transform: scale(0);
      transition: all var(--transition-base);
    }

    .option-card.selected .option-check {
      opacity: 1;
      transform: scale(1);
    }

    /* ─────────────────────────────────────────────────────────────────
       HEADER / NAV
       ───────────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) 0;
      position: sticky;
      top: 0;
      background: var(--bg-primary);
      z-index: 100;
    }

    .header-back {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      transition: all var(--transition-fast);
      cursor: pointer;
    }

    .header-back:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .header-title {
      font-size: var(--text-lg);
      font-weight: 600;
    }

    .header-action {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      transition: all var(--transition-fast);
      cursor: pointer;
    }

    .header-action:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    /* ─────────────────────────────────────────────────────────────────
       STEP INDICATOR
       ───────────────────────────────────────────────────────────────── */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      margin-bottom: var(--space-6);
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--border-medium);
      transition: all var(--transition-base);
    }

    .step-dot.active {
      width: 24px;
      background: var(--brand-primary);
    }

    .step-dot.completed {
      background: var(--success);
    }

    /* ─────────────────────────────────────────────────────────────────
       FLOATING BOTTOM BAR
       ───────────────────────────────────────────────────────────────── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-light);
      padding: var(--space-4);
      padding-bottom: max(var(--space-4), env(safe-area-inset-bottom));
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
      z-index: 100;
    }

    .bottom-bar-inner {
      max-width: 428px;
      margin: 0 auto;
      display: flex;
      gap: var(--space-3);
    }

    /* ─────────────────────────────────────────────────────────────────
       CELEBRATION SCREEN
       ───────────────────────────────────────────────────────────────── */
    .celebration {
      position: fixed;
      inset: 0;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-6);
      z-index: 200;
      animation: fadeIn 300ms ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .celebration-icon {
      width: 120px;
      height: 120px;
      background: var(--success-light);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      margin-bottom: var(--space-6);
      animation: celebrateIcon 600ms var(--transition-bounce);
    }

    @keyframes celebrateIcon {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .celebration-title {
      font-size: var(--text-3xl);
      font-weight: 700;

  const dest = (destination || '').toLowerCase();
  const month = startDate ? new Date(startDate).getMonth() : new Date().getMonth();
  const isWinter = month >= 10 || month <= 2;

  // Tropical destinations
  if (dest.match(/bali|thailand|phuket|bangkok|vietnam|indonesia|maldiven|singapore|kuala/)) {
    return { temp: 30, icon: '🌴', desc: 'Tropisch warm', climate: 'tropical' };

      : { temp: 28, icon: '☀️', desc: 'Zonnig & warm', climate: 'hot' };

      : { temp: 15, icon: '🌤️', desc: 'Fris', climate: 'mild' };

    return { temp: -2, icon: '⛷️', desc: 'Sneeuw', climate: 'cold' };

    return { temp: 28, icon: '☀️', desc: 'Warm & zonnig', climate: 'hot' };

    return { temp: 2, icon: '❄️', desc: 'Koud', climate: 'cold' };
  }
  // Caribbean
  if (dest.match(/curacao|aruba|bonaire/)) {
    return { temp: 30, icon: '🏝️', desc: 'Tropisch', climate: 'tropical' };
  }

// Generate filtered packing items based on trip answers
const getFilteredItems = (answers) => {
  const result = {};
  const climate = answers.climate || 'mild';
  const activities = answers.activities || [];
  const tripType = answers.tripType || [];
  const transport = answers.transport || [];
  const accommodation = answers.accommodation || [];

  Object.entries(allItems).forEach(([catKey, category]) => {
    // Check category condition
    if (category.condition && !category.condition(answers)) return;

    const filteredItems = category.items.filter(item => {
      // Always include "always" items
      if (item.always) return true;

      // Check climate filter
      if (item.climate && !item.climate.includes(climate)) return false;

      // Check activities filter
      if (item.activities && !item.activities.some(a => activities.includes(a))) {
        // Only exclude if this item REQUIRES specific activities
        if (!item.optional) return false;
      }

      // Check tripType filter
      if (item.tripType && !item.tripType.some(t => tripType.includes(t))) {
        if (!item.optional) return false;
      }

      // Check transport filter
      if (item.transport && !item.transport.some(t => transport.includes(t))) {
        return false;
      }

      return true;
    });

    if (filteredItems.length > 0) {
      result[catKey] = {
        name: category.name,
        icon: category.icon,
        items: filteredItems.map(item => ({ ...item, packed: false }))
      };
    }
  });

  return result;
};

const formatDate = (dateStr) => {
  if (!dateStr) return "";
  const date = new Date(dateStr);
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
};

const getGreeting = () => {
  const hour = new Date().getHours();
  if (hour < 12) return "Goedemorgen";
  if (hour < 18) return "Goedemiddag";
  return "Goedenavond";
};

const calculateProgress = (items) => {
  let total = 0;
  let packed = 0;
  Object.values(items).forEach(cat => {
    cat.items.forEach(item => {
      total++;
      if (item.packed) packed++;
    });
  });
  return total > 0 ? Math.round((packed / total) * 100) : 0;
};

  render();
};

window.updateStartDate = (value) => {
  state.newTrip.startDate = value;
  updateDaysDisplay();
};

window.updateEndDate = (value) => {
  state.newTrip.endDate = value;
  updateDaysDisplay();
};

window.updateDaysDisplay = () => {
  const daysCard = document.getElementById('daysCard');
  const daysCount = document.getElementById('daysCount');
  const datesDisplay = document.getElementById('datesDisplay');
  const nextBtn = document.querySelector('.bottom-bar .btn-primary');

  if (state.newTrip.startDate && state.newTrip.endDate) {
    const days = calculateDays();
    if (daysCard) daysCard.style.display = 'block';
    if (daysCount) daysCount.textContent = days + ' dagen';
    if (datesDisplay) datesDisplay.textContent = formatDate(state.newTrip.startDate) + ' - ' + formatDate(state.newTrip.endDate);
    if (nextBtn) {
      nextBtn.disabled = false;
      nextBtn.style.opacity = '1';
    }
  } else {
    if (daysCard) daysCard.style.display = 'none';
    if (nextBtn) {
      nextBtn.disabled = true;
      nextBtn.style.opacity = '0.5';
    }
  }
};

window.prevStep = () => {
  // Reset autocomplete state when changing steps
  state.showAutocomplete = false;

  if (state.newTrip.step > 0) {
    state.newTrip.step--;
    render();
  }
};

window.nextStep = () => {
  // Reset autocomplete state when changing steps
  state.showAutocomplete = false;

  if (state.newTrip.step < 6) {
    state.newTrip.step++;
    render();
  } else {
    // Get weather/climate data for destination
    const weather = getWeatherData(state.newTrip.destination, state.newTrip.startDate);

    // Build answers object for smart filtering
    const answers = {
      climate: weather.climate,
      activities: state.newTrip.activities,
      tripType: state.newTrip.tripType,
      transport: state.newTrip.transport,
      accommodation: state.newTrip.accommodation,
      travelers: state.newTrip.travelers
    };

    // Create trip with filtered items based on all answers
    const filteredItems = getFilteredItems(answers);

    const newTrip = {
      id: Date.now(),
      destination: state.newTrip.destination,
      icon: tripTypes.find(t => t.value === state.newTrip.tripType[0])?.icon || "✈️",
      startDate: state.newTrip.startDate,
      endDate: state.newTrip.endDate,
      tripType: state.newTrip.tripType,
      travelers: state.newTrip.travelers,
      accommodation: state.newTrip.accommodation,
      transport: state.newTrip.transport,
      activities: state.newTrip.activities,
      climate: weather.climate,
      progress: 0,
      items: filteredItems
    };
    state.trips.unshift(newTrip);
    state.currentTrip = newTrip;
    state.screen = "packing";
    saveState();
    render();
  }
};

window.canProceed = () => {
  switch (state.newTrip.step) {
    case 0: return state.newTrip.destination.length > 2;
    case 1: return state.newTrip.startDate && state.newTrip.endDate;
    case 2: return state.newTrip.travelers.length > 0;
    case 3: return state.newTrip.tripType.length > 0;
    case 4: return state.newTrip.accommodation.length > 0;
    case 5: return state.newTrip.transport.length > 0;
    case 6: return true; // Activities are optional
    default: return false;
  }
};

window.calculateDays = () => {
  if (!state.newTrip.startDate || !state.newTrip.endDate) return 0;
  const start = new Date(state.newTrip.startDate);
  const end = new Date(state.newTrip.endDate);
  return Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
};

window.openTrip = (id) => {
  const trip = state.trips.find(t => t.id === id);
  if (trip) {
    state.currentTrip = trip;
    state.screen = "packing";
    render();
  }
};

window.toggleCategory = (key) => {
  const idx = state.expandedCategories.indexOf(key);
  if (idx === -1) {
    state.expandedCategories.push(key);
  } else {
    state.expandedCategories.splice(idx, 1);
  }
  render();
};

window.toggleItem = (categoryKey, itemIdx) => {
  const item = state.currentTrip.items[categoryKey].items[itemIdx];
  item.packed = !item.packed;
  state.currentTrip.progress = calculateProgress(state.currentTrip.items);

  // Update trip in trips array
  const tripIdx = state.trips.findIndex(t => t.id === state.currentTrip.id);
  if (tripIdx !== -1) {
    state.trips[tripIdx] = state.currentTrip;
  }

  saveState();
  render();
};

window.showCelebration = () => {
  state.screen = "celebration";
  render();
};

window.toggleTheme = () => {
  state.theme = state.theme === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", state.theme);
  localStorage.setItem("paklijst_v2_theme", state.theme);
  render();
};

window.useTemplate = (templateId) => {
  // Start new trip with template
  state.newTrip = { step: 0, destination: "", startDate: "", endDate: "", travelers: [], tripType: [], accommodation: [], transport: [], activities: [] };
  state.screen = "newtrip";
  render();
};

window.shareList = () => {
  alert("Delen functie komt binnenkort! 📤");
};

window.saveAsTemplate = () => {
  alert("Template opgeslagen! 📋");
  goHome();
};

window.createConfetti = () => {
  const colors = ["#0D9488", "#F97316", "#10B981", "#3B82F6", "#8B5CF6"];
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDelay = Math.random() * 2 + "s";
    confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
    document.body.appendChild(confetti);

    setTimeout(() => confetti.remove(), 5000);
  }
};

// ─────────────────────────────────────────────────────────────────────────────
// INITIALIZATION
// ─────────────────────────────────────────────────────────────────────────────

// Load saved state
const savedState = localStorage.getItem("paklijst_v2_state");
if (savedState) {
  try {
    const parsed = JSON.parse(savedState);
    state.trips = parsed.trips || state.trips;
  } catch (e) {
    console.log("Could not load saved state");
  }
}

// Initial render
render();

// Close autocomplete on outside click (only re-render if it was open)
document.addEventListener("click", (e) => {
  if (!e.target.closest(".autocomplete-wrapper") && state.showAutocomplete) {
    state.showAutocomplete = false;
    render();
  }
});
</script>
</body>
</html>
